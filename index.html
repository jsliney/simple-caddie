      <p class="small">No handicap. No subscription. No account. No GPS. Nothing leaves this phone unless you tap Share.</p>
      <p class="small">Distances are marked <span class="src guess">guess</span>, <span class="src mine">mine</span> (you typed it), or <span class="src range">range</span>. Yours beat guesses.</p>
    </div>
    <details><summary>What's new in v3</summary><ul class="plain">${WHATS_NEW.map(w => `<li class="small">${esc(w)}</li>`).join("")}</ul></details>
    <button class="btn wide" style="margin-top:12px" data-act="seen-intro">Got it</button>
  `;
}

function fresh() {
  const f = ui.fresh;
  if (!f.clubs) f.clubs = DEFAULT_CLUBS.filter(c => c.inBag && c.id !== "PU").map(c => c.id);
  if (!f.courses) f.courses = COURSE_PRESETS.map(p => p.id);
  const dots = [0, 1, 2, 3].map(i => `<span class="${i <= f.step ? "on" : ""}"></span>`).join("");
  if (f.step === 0) {
    return `
      <div class="kicker">Fresh start</div>
      <h1>Simple Caddie</h1>
      <div class="wizard-dots">${dots}</div>
      <div class="card">
        <p><strong>A pocket caddie for people who play a few times a year.</strong></p>
        <p>On the course: type the yards (or tap Don't know) and get one club and one sentence.</p>
        <p class="small">Three quick steps: your clubs, one distance you know, your courses. Nothing leaves this phone.</p>
      </div>
      <div class="stack" style="margin-top:12px">
        <button class="btn wide" data-act="fresh-next">Set it up · 1 minute</button>
        <button class="ghost wide" data-act="fresh-skip">Skip — use the standard bag</button>
      </div>`;
  }
  if (f.step === 1) {
    const chips = DEFAULT_CLUBS.filter(c => c.id !== "PU").map(c =>
      `<button class="chip" data-act="fresh-club" data-id="${c.id}" aria-pressed="${f.clubs.includes(c.id)}">${esc(c.short === "Hybrid" ? "Hybrid" : c.short)}</button>`).join("");
    return `
      <div class="kicker">Step 1 of 3</div>
      <h2>What's in your bag?</h2>
      <div class="wizard-dots">${dots}</div>
      <p class="muted">Tap to add or remove. Putter is always in. You can change this later.</p>
      <div class="chips">${chips}</div>
      <div class="split" style="margin-top:16px">
        <button class="ghost" data-act="fresh-back">Back</button>
        <button class="btn" data-act="fresh-next">Next</button>
      </div>`;
  }
  if (f.step === 2) {
    const opts = DEFAULT_CLUBS.filter(c => f.clubs.includes(c.id) && GAP_RATIO[c.id]).map(c =>
      `<option value="${c.id}" ${f.clubId === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("");
    return `
      <div class="kicker">Step 2 of 3</div>
      <h2>One club you know.</h2>
      <div class="wizard-dots">${dots}</div>
      <p class="muted">How far does one club fly when you hit it OK? We'll guess the rest. The range or your own numbers replace guesses later.</p>
      <label class="field">Club</label>
      <select id="fresh-club">${opts}</select>
      <label class="field">Yards it carries</label>
      <input id="fresh-carry" inputmode="numeric" value="${esc(f.carry)}" placeholder="e.g. 140">
      <button class="chip wide" style="margin-top:10px" data-act="fresh-never" aria-pressed="${f.never}">Never played / no idea — use beginner numbers</button>
      <div class="split" style="margin-top:16px">
        <button class="ghost" data-act="fresh-back">Back</button>
        <button class="btn" data-act="fresh-next">Next</button>
      </div>`;
  }
  const list = COURSE_PRESETS.map(p => `
    <label class="check"><input type="checkbox" data-fresh-course="${p.id}" ${f.courses.includes(p.id) ? "checked" : ""}> ${esc(p.name)} <span class="small">· ${esc(p.place)}</span></label>`).join("");
  return `
    <div class="kicker">Step 3 of 3</div>
    <h2>Your courses.</h2>
    <div class="wizard-dots">${dots}</div>
    <p class="muted">These come with real scorecards. Keep the ones you play. Add your own if it's not here.</p>
    <div class="card">${list}</div>
    <label class="field">Add a course (optional)</label>
    <input id="fresh-newcourse" value="${esc(f.newCourse)}" placeholder="Course name">
    <div class="split" style="margin-top:16px">
      <button class="ghost" data-act="fresh-back">Back</button>
      <button class="btn" data-act="fresh-finish">Done</button>
    </div>`;
}

function home() {
  const last = data.rounds[0];
  const live = data.live && data.live.date === today() ? data.live : null;
  const lt = live ? liveTotals() : null;
  return `
    <div class="kicker">Simple Caddie</div>
    <h1>Hit the ball.</h1>
    <p class="muted">Not far — solid.</p>
    ${flashHtml()}
    ${live && lt.holes ? `<div class="tip"><strong>Round in progress</strong><p class="small" style="margin:4px 0 0">Hole ${live.hole} · ${lt.strokes} strokes through ${lt.holes}</p></div>` : ""}
    ${whatsNewCard()}
    <div class="stack">
      <button class="job door" data-go="card"><strong>Caddie</strong><span>On the course. One club, tee or no tee, one sentence.</span></button>
      <button class="job door" data-go="pro"><strong>Practice</strong><span>Range or living room. Plan built from your rounds.</span></button>
      <button class="job door" data-go="learn"><strong>Learn</strong><span>How to hit each shot. At-home drills. Simple rules.</span></button>
    </div>
    <div style="margin-top:12px">${focusLine("home")}</div>
    <div class="secondary">
      <button class="ghost" data-go="bag">My bag · tune-up</button>
      <button class="ghost" data-go="mybag">My distances</button>
      <button class="ghost" data-go="courses">Courses & tees</button>
      <button class="ghost" data-go="trends">Trends</button>
      <button class="ghost" data-go="friend">Help a friend</button>
      <button class="ghost" data-go="intro">Instructions</button>
    </div>
    <p class="small" style="margin-top:16px">${data.rangeSessions.reduce((n, s) => n + (s.total || 0), 0)} range reps · ${data.shots.length} course shots · ${data.rounds.length} rounds${last && last.score ? " · last score " + esc(last.score) : ""}.</p>
    ${backup()}
    <p class="small">Version ${esc(APP_VERSION)}</p>
  `;
}

function holeBarHtml() {
  const course = data.courses.find(c => c.id === data.activeCourseId);
  if (!course) return `<button class="ghost wide" data-go="courses">Pick today's course (optional)</button>`;
  const live = ensureLive();
  const holes = courseHoles(course);
  const h = holes.find(x => x.n === live.hole) || { n: live.hole, par: "", yards: "" };
  return `<div class="card">
    <div class="holebar">
      <button class="step" data-act="hole-prev" aria-label="Previous hole">◀</button>
      <div class="mid"><strong>Hole ${h.n}${h.par ? " · Par " + h.par : ""}</strong>
        <span class="small">${h.yards ? esc(h.yards) + " yds" : "no yardage"}${course.tee && SCORECARDS[course.id] ? " · " + esc(course.tee) : ""} · ${esc(shortCourseName(course))}</span></div>
      <button class="step" data-act="hole-next" aria-label="Next hole">▶</button>
    </div>
    ${h.yards && Number(h.par) > 3 ? `<button class="ghost wide" style="margin-top:8px" data-act="tee-read">Tee shot on ${h.n}</button>` : ""}
    ${h.yards && Number(h.par) === 3 ? `<button class="ghost wide" style="margin-top:8px" data-act="tee-read">Par 3: ${esc(h.yards)} yds — pick a club</button>` : ""}
  </div>`;
}

function card() {
  const n = phoneHoles();
  const pocket = n >= 2;
  const tc = data.todayCheck || {};
  const rows = data.clubs.filter(c => c.inBag && c.id !== "PU").map(c => `
    <tr><td>${esc(c.name)} ${srcBadge(c)}</td><td class="num">${c.yards}</td></tr>`).join("");
  return `
    ${topBar("Caddie", "home")}
    ${flashHtml()}
    ${driverBenched() ? `<div class="reply warnline"><strong>Driver benched.</strong> Two missed drives this round — hybrid off the tee.<button class="ghost wide" style="margin-top:8px" data-act="unbench">Give the driver another shot</button></div>` : ""}
    ${holeBarHtml()}
    <div class="stack no-print" style="margin-top:12px">
      <button class="btn wide" style="min-height:68px;font-size:22px" data-go="ask">Ask for a club</button>
      <button class="ghost wide" data-act="one-thing">Give me one thing</button>
      <div class="split">
        <button class="ghost" data-go="scorecard">Scorecard</button>
        <button class="ghost" data-go="round">End the round</button>
      </div>
    </div>
    <div class="kicker" style="margin-top:16px">${pocket ? "Phone goes away" : "Glance card · hole " + (n + 1) + " of 2"}</div>
    <p class="small">${pocket ? "You have the card. Ask only if the lie is a real question." : "Glance, then pocket it. After two holes, the phone goes away."}</p>
    ${tc.message && tc.date === today() ? `<div class="tip"><strong>Iron + wood today</strong><p class="small" style="margin:6px 0 0">${esc(tc.message)}</p></div>` : ""}
    <div class="card">
      <table class="card-table"><thead><tr><th>Club</th><th class="num">Yards</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="stack no-print" style="margin-top:12px">
      ${pocket ? "" : `<button class="ghost wide" data-act="pocket-hole">Glance done · next hole</button>`}
      <button class="ghost wide" data-go="todaycheck">Iron + wood today check</button>
    </div>
  `;
}

const YARD_CHIPS = [30, 50, 75, 100, 125, 150, 175, 200];
function ask() {
  const a = ui.ask;
  if (!a.courseId && data.activeCourseId) a.courseId = data.activeCourseId;
  const courseOpts = [`<option value="">No course</option>`].concat(data.courses.map(c =>
    `<option value="${esc(c.id)}" ${a.courseId === c.id ? "selected" : ""}>${esc(c.name)}</option>`)).join("");
  const course = data.courses.find(c => c.id === a.courseId);
  let holeBits = "";
  const holes = courseHoles(course);
  if (holes.length) {
    holeBits = `<label class="field">Hole</label><select data-field="hole"><option value="">—</option>${holes.map(h =>
      `<option value="${h.n}" ${String(a.hole) === String(h.n) ? "selected" : ""}>${h.n}${h.par ? " · par " + h.par : ""}${h.yards ? " · " + esc(h.yards) : ""}</option>`).join("")}</select>`;
  }
  if (course && course.greens) {
    const g = course.greens;
    holeBits += `<p class="small">Greens: ${esc(g.speed)} speed · ${esc(g.firm)} · ${esc(g.slope)} slope · ${esc(g.size)}.</p>`;
  }
  const holeNow = holes.find(h => String(h.n) === String(a.hole));
  const mode = (name, label) => `<button class="chip" data-mode="${name}" aria-pressed="${a.mode === name ? "true" : "false"}">${label}</button>`;
  const choice = (group, value, label) => `<button class="choice" data-group="${group}" data-value="${value}" aria-pressed="${a[group] === value ? "true" : "false"}">${label}</button>`;
  const chips = YARD_CHIPS.map(y => `<button class="chip" data-act="ydset" data-y="${y}" aria-pressed="${String(a.yards) === String(y)}">${y}</button>`).join("");
  return `
    ${topBar("Ask", "card")}
    ${rangeBannerHtml()}
    <h2>How far?</h2>
    <p class="small">From Golf Buddy or the rangefinder. Or tap Don't know.</p>
    <div class="yardbox">
      <button class="step" data-act="yd" data-d="-5" aria-label="Minus 5">−5</button>
      <input id="yards" inputmode="numeric" pattern="[0-9]*" placeholder="${a.mode === "unknown" ? "?" : "yds"}" value="${esc(a.yards)}">
      <button class="step" data-act="yd" data-d="5" aria-label="Plus 5">+5</button>
    </div>
    <div class="chips">${chips}
      ${holeNow && holeNow.yards ? `<button class="chip" data-act="ydset" data-y="${esc(holeNow.yards)}" data-lie="tee">Hole ${holeNow.n}: ${esc(holeNow.yards)}</button>` : ""}
    </div>
    <div class="row" style="margin-top:8px">${mode("unknown", "Don't know")}${mode("shaky", "Shaky number")}</div>
    <label class="field">Lie</label>
    <div class="row">${choice("lie", "tee", "Tee")}${choice("lie", "fairway", "Fairway")}${choice("lie", "rough", "Rough")}${choice("lie", "bunker", "Bunker")}${choice("lie", "green", "Green")}</div>
    <label class="field">Hill</label>
    <div class="row">${choice("hill", "flat", "Flat")}${choice("hill", "up", "Uphill")}${choice("hill", "down", "Downhill")}</div>
    <label class="field">Are you tilted?</label>
    <div class="row">${choice("tilt", "level", "Level")}${choice("tilt", "toward", "Toward the ball")}${choice("tilt", "away", "Away")}${choice("tilt", "left", "Left side low")}${choice("tilt", "right", "Right side low")}</div>
    <label class="check" style="margin-top:10px"><input type="checkbox" id="must-carry" ${a.mustCarry ? "checked" : ""}> Must carry (bunker / rough / water)</label>
    <button class="btn wide" style="margin-top:12px;min-height:68px;font-size:22px" data-act="recommend">What do I hit?</button>
    <button class="ghost wide" style="margin-top:8px" data-act="one-thing">Give me one thing</button>
    <h3>Quick situations</h3>
    <button class="situ" data-act="situ" data-situ="punch"><strong>Blocked / punch out</strong><span>Low 7-iron back to the fairway.</span></button>
    <button class="situ" data-act="situ" data-situ="tree"><strong>Tree trouble</strong><span>Sideways to short grass.</span></button>
    <button class="situ" data-act="situ" data-situ="roll"><strong>Close: roll it</strong><span>Bump with the 52.</span></button>
    <button class="situ" data-act="situ" data-situ="loft"><strong>Close: loft it</strong><span>Must carry — 56, soft landing.</span></button>
    <button class="situ" data-act="situ" data-situ="bunker"><strong>Bunker</strong><span>Sand first, get it out.</span></button>
    <button class="situ" data-act="situ" data-situ="deeprough"><strong>Deep rough</strong><span>Advance it. No hero.</span></button>
    <button class="situ" data-act="situ" data-situ="above"><strong>Ball above feet</strong><span>Choke down, aim a touch right.</span></button>
    <button class="situ" data-act="situ" data-situ="below"><strong>Ball below feet</strong><span>Stay down, one more club.</span></button>
    <button class="situ" data-act="situ" data-situ="bincline"><strong>Big hill</strong><span>Match the slope. Easy swing.</span></button>
    <label class="field">Course</label>
    <select data-field="courseId">${courseOpts}</select>
    ${holeBits}
  `;
}

function read() {
  const r = ui.read || data.lastRead;
  if (!r) return card();
  const guess = (r.note || "").indexOf("guess") >= 0;
  const how = r.how ? HOWTO.find(h => h.id === r.how) : null;
  const rep = ui.reply;
  return `
    ${topBar("Read", "ask")}
    <div class="kicker">One club ${guess ? '<span class="badge">guess</span>' : '<span class="badge ok">set</span>'}</div>
    <div class="club-hero">${esc(r.club)}</div>
    <div class="tee-hero">${esc(r.tee)}</div>
    <p class="sentence">${esc(r.sentence)}</p>
    ${r.trustLine ? `<p class="small"><strong>${esc(r.trustLine)}</strong></p>` : ""}
    <p class="small">${esc(r.note || "")}</p>
    ${r.diagram ? `<div class="svg-wrap">${chipSvg(r.diagram)}</div>` : ""}
    <div class="stack no-print">
      ${rep ? `<div class="reply ${rep.cls}">${esc(rep.text)}</div>
        <button class="btn wide" data-act="next-shot">Next shot</button>
        <button class="ghost wide" data-go="card">Back to the card</button>`
      : `<div class="split">
          <button class="hit" data-act="result" data-result="hit">Hit it</button>
          <button class="miss" data-act="result" data-result="missed">Missed</button>
        </div>`}
      ${how ? `<button class="ghost wide" data-act="open-how" data-id="${how.id}" data-back="read">How to hit it: ${esc(how.title)}</button>` : ""}
      <div class="split">
        <button class="ghost" data-act="speak">Read it to me</button>
        <button class="ghost" data-act="one-thing">One thing</button>
      </div>
      ${rep ? "" : `<div class="split"><button class="ghost" data-go="ask">Change the shot</button><button class="ghost" data-go="card">Back to the card</button></div>`}
    </div>
  `;
}

function scorecard() {
  const live = ensureLive();
  if (!live.courseId && data.activeCourseId) live.courseId = data.activeCourseId;
  const course = data.courses.find(c => c.id === live.courseId);
  const holes = courseHoles(course);
  const t = liveTotals();
  const courseOpts = [`<option value="">No course</option>`].concat(data.courses.map(c =>
    `<option value="${esc(c.id)}" ${live.courseId === c.id ? "selected" : ""}>${esc(c.name)}</option>`)).join("");
  const rows = live.holes.map(h => {
    const hp = holes.find(x => x.n === h.n) || {};
    return `<div class="sc-row">
      <strong>${h.n}</strong>
      <span class="small">${hp.par ? "P" + hp.par : ""}</span>
      <input inputmode="numeric" data-sc="${h.n}" data-scf="strokes" value="${esc(h.strokes)}" placeholder="score" aria-label="Score hole ${h.n}">
      <input inputmode="numeric" data-sc="${h.n}" data-scf="putts" value="${esc(h.putts)}" placeholder="putts" aria-label="Putts hole ${h.n}">
      <label class="pen"><input type="checkbox" data-sc="${h.n}" data-scf="pen" ${h.pen ? "checked" : ""}> pen</label>
    </div>`;
  }).join("");
  return `
    ${topBar("Scorecard", "card")}
    <h2>Optional scorecard.</h2>
    <p class="muted">Score and putts if you want them. "pen" = a penalty or lost ball. Saved as you type. Not a handicap.</p>
    <label class="field">Course</label>
    <select id="live-course">${courseOpts}</select>
    <div class="card" style="margin-top:10px">
      <p style="margin:0"><strong>${t.strokes || "—"}</strong> strokes through ${t.holes} · ${t.putts || "—"} putts · ${t.pens} pen${t.holes && course ? " · " + (t.toPar >= 0 ? "+" : "") + t.toPar + " to par" : ""}</p>
    </div>
    <div class="sc-row sc-head" style="margin-top:10px"><span>#</span><span>par</span><span>score</span><span>putts</span><span></span></div>
    ${rows}
    <button class="btn wide" style="margin-top:12px" data-go="card">Back to the card</button>
    <button class="ghost wide" style="margin-top:8px" data-go="round">End the round</button>
  `;
}

function round() {
  const live = data.live && data.live.date === today() ? data.live : null;
  const t = liveTotals();
  const r = ui.round;
  if (!r.courseId) r.courseId = (live && live.courseId) || data.activeCourseId || "";
  if (!r.score && live && t.holes) r.score = String(t.strokes);
  const courseOpts = [`<option value="">Course</option>`].concat(data.courses.map(c =>
    `<option value="${esc(c.id)}" ${r.courseId === c.id ? "selected" : ""}>${esc(c.name)}</option>`)).join("");
  const checks = SIDEWAYS_V2.map(([id, label]) => `
    <label class="check"><input type="checkbox" data-side="${id}" ${r.sideways.includes(id) ? "checked" : ""}> ${label}</label>`).join("");
  return `
    ${topBar("End the round", "card")}
    <h2>How'd it go?</h2>
    <p class="muted">Score and what went sideways. That's what Trends and the Pro use.</p>
    <label class="field">Score${live && t.holes ? " (from your scorecard: " + t.holes + " holes)" : ""}</label>
    <input id="score" inputmode="numeric" value="${esc(r.score)}" placeholder="Strokes">
    <label class="field">Course</label>
    <select id="round-course">${courseOpts}</select>
    <label class="field">What went sideways? (tap any)</label>
    <div class="card">${checks}</div>
    <label class="field">Note, if you want one</label>
    <textarea id="round-note" placeholder="Optional">${esc(r.note)}</textarea>
    <button class="btn wide" style="margin-top:12px" data-act="save-round">Log the round</button>
  `;
}

function trends() {
  const t = trendStats();
  const drill = t.top && HOME_DRILLS[t.top];
  const rank = trustedRanking();
  const rankHtml = rank.length ? rank.slice(0, 8).map(x => `
    <div class="trust-row"><strong>${esc(x.c.short)}</strong>
      <div class="chart-bar-wrap"><div class="chart-bar" style="width:${Math.round(x.t.score * 100)}%"></div></div>
      <span class="small">${Math.round(x.t.score * 100)}% · ${x.t.n}</span></div>`).join("")
    : `<p class="small">Tap Hit it / Missed on the course and Straight on the range. Your most-trusted clubs show up here and the caddie leans on them.</p>`;
  const shots = data.shots.slice(0, 15).map(s => `<p class="small">${esc(s.date)} · ${esc(s.club)} · ${esc(s.result || "no tap")}</p>`).join("");
  const rounds = data.rounds.slice(0, 10).map(r => `<p class="small">${esc(r.date)} · ${esc(r.score || "—")} · ${esc((r.sideways || []).map(sidewaysLabel).join(", ") || "clean enough")}${r.course ? " · " + esc(shortCourseName({ name: r.course })) : ""}</p>`).join("");
  return `
    ${topBar("Trends", "home")}
    ${flashHtml()}
    <h2>Your trends.</h2>
    <div class="card">
      <p><strong>Average score:</strong> ${t.avg != null ? t.avg : "—"}${t.avg5 != null && t.rounds > 5 ? " · last 5: " + t.avg5 : ""}${t.best != null ? " · best: " + t.best : ""}</p>
      <p><strong>Average putts:</strong> ${t.putts != null ? t.putts : "—"}</p>
      <p style="margin:0"><strong>Most-named problem:</strong> ${t.top ? esc(sidewaysLabel(t.top)) + " (" + t.topCount + "×)" : "— log a round"}</p>
    </div>
    ${(() => { const n = trendNudges()[0]; const d = n && AT_HOME.find(x => x.id === n.id); return d ? `<div class="tip"><strong>At home: ${esc(d.title)}</strong><p class="small" style="margin:4px 0 6px">${esc(n.why)}</p><button class="ghost" data-act="go-athome" data-back="trends">Show me the drill</button></div>` : ""; })()}
    ${drill ? `<div class="tip"><strong>20 minutes at home: ${esc(drill.title)}</strong>
      <ul class="plain">${drill.steps.map(s => `<li class="small">${esc(s)}</li>`).join("")}</ul>
      <button class="ghost" style="margin-top:8px" data-act="speak-text" data-text="${esc(drill.title + ". " + drill.steps.join(" "))}">Read it to me</button></div>` : ""}
    <h3>Clubs you trust</h3>
    <div class="card">${rankHtml}</div>
    ${t.worstClub ? `<p class="small">Most missed on the course lately: ${esc(t.worstClub)} (${t.worstCount}×).</p>` : ""}

/* ---- Learn ---- */
const CLOCK = h => { const a = (h % 12) / 12 * Math.PI * 2; return [Math.sin(a), -Math.cos(a)]; };
function howSvg(o) {
  const gap = o.stance === "narrow" ? 26 : o.stance === "medium" ? 40 : 56;
  const cx = 95, footY = 92;
  const ballX = { back: cx - gap * 0.35, middle: cx, fwdmid: cx + gap * 0.25, heelin: cx + gap * 0.55, heel: cx + gap * 0.75 }[o.ball] || cx;
  const r = 44, ox = 270, oy = 76;
  const [bx, by] = CLOCK(o.back);
  const [tx, ty] = CLOCK(o.thru);
  const largeB = Math.abs(o.back - 6) > 6 ? 1 : 0;
  const largeT = Math.abs(6 - o.thru) > 6 ? 1 : 0;
  const flight = o.flight === "roll" ? "M100 40 Q130 26 150 36 L176 36"
    : o.flight === "putt" ? "M100 36 L176 36"
    : o.flight === "high" ? "M100 40 Q138 0 176 30" : "M100 40 Q138 14 176 34";
  const backLabel = o.flight === "putt" ? "shoulders rock" : (o.back >= 12 ? "full" : "to " + (o.back % 1 ? Math.floor(o.back) + "½" : o.back) + " o'clock");
  return `<svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stance and swing size">
    <rect x="0" y="0" width="190" height="150" fill="#eef3e6" rx="10"/>
    <text x="8" y="16" font-size="11" fill="#5e564c">from above · target →</text>
    <path d="${flight}" fill="none" stroke="#2d6a4f" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="176,30 186,36 176,42" fill="#2d6a4f"/>
    <rect x="${cx - gap / 2 - 9}" y="${footY}" width="18" height="34" rx="8" fill="#5e564c"/>
    <rect x="${cx + gap / 2 - 9}" y="${footY}" width="18" height="34" rx="8" fill="#5e564c"/>
    <text x="${cx - gap / 2 - 12}" y="${footY + 48}" font-size="10" fill="#5e564c">back</text>
    <text x="${cx + gap / 2 - 10}" y="${footY + 48}" font-size="10" fill="#5e564c">front</text>
    <line x1="20" y1="80" x2="180" y2="80" stroke="#b9ad97" stroke-width="1"/>
    <circle cx="${ballX}" cy="80" r="6" fill="#fff" stroke="#1c1915"/>
    ${o.tee ? `<rect x="${ballX - 1.5}" y="86" width="3" height="8" fill="#8a5a12"/>` : ""}
    <circle cx="${ox}" cy="${oy}" r="${r}" fill="#fffdf8" stroke="#d9cfbe"/>
    <text x="${ox - 4}" y="${oy - r + 12}" font-size="10" fill="#5e564c">12</text>
    <text x="${ox - r + 4}" y="${oy + 4}" font-size="10" fill="#5e564c">9</text>
    <text x="${ox + r - 12}" y="${oy + 4}" font-size="10" fill="#5e564c">3</text>
    <path d="M${ox} ${oy + r} A${r} ${r} 0 ${largeB} 1 ${ox + bx * r} ${oy + by * r}" fill="none" stroke="#8a3b2e" stroke-width="5" stroke-linecap="round"/>
    <path d="M${ox} ${oy + r} A${r} ${r} 0 ${largeT} 0 ${ox + tx * r} ${oy + ty * r}" fill="none" stroke="#1b4332" stroke-width="5" stroke-linecap="round"/>
    <text x="200" y="144" font-size="11" fill="#8a3b2e">back: ${backLabel}</text>
    <text x="300" y="144" font-size="11" fill="#1b4332">through</text>
  </svg>`;
}
function howCardHtml(h) {
  return `<div class="card how">
    <div class="kicker">How to hit it</div>
    <h2>${esc(h.title)}</h2>
    <div class="svg-wrap">${howSvg(h.svg)}</div>

/* ---- Trend nudges: data -> one at-home drill, with the reason ---- */
function puttStats() {
  let putts = 0, holes = 0, threes = 0;
  data.rounds.slice(0, 10).forEach(r => {
    const hs = (r.holes || []).filter(h => Number(h.putts) > 0);
    if (hs.length) {
      hs.forEach(h => { putts += Number(h.putts); holes++; if (Number(h.putts) >= 3) threes++; });
    } else if (Number(r.putts) > 0) {
      putts += Number(r.putts); holes += Number(r.holesPlayed) || 18;
    }
  });
  // today's card counts too, so the nudge shows up mid-trip
  if (data.live && data.live.holes) data.live.holes.forEach(h => { if (Number(h.putts) > 0) { putts += Number(h.putts); holes++; if (Number(h.putts) >= 3) threes++; } });
  return { per18: holes ? Math.round(putts / holes * 18) : null, holes, threes };
}
function trendNudges() {
  const out = [];
  const add = (id, why) => { if (!out.find(n => n.id === id)) out.push({ id, why }); };
  const ps = puttStats();
  if (ps.holes >= 6 && ps.per18 >= 36) add("carpet", "You're averaging about " + ps.per18 + " putts per 18" + (ps.threes ? " with " + ps.threes + " three-putts" : "") + ". Two putts a hole is 36 — carpet putting is the cheapest strokes you'll find.");
  else if (ps.threes >= 3) add("carpet", ps.threes + " three-putts logged. Lag speed on the carpet fixes most of them.");
  const t = trendStats();
  const c = t.counts || {};
  if (c.putting) add("carpet", "Putting went sideways in " + c.putting + " of your last rounds.");
  const shortMiss = data.shots.slice(0, 60).filter(s => s.result === "missed" && ["52", "54", "56", "58", "SW", "AW", "PW"].includes(s.clubId) && Number(s.ask && s.ask.yards) > 0 && Number(s.ask.yards) <= 40).length;
  if (c.chipping || shortMiss >= 2) add("basket", c.chipping ? "Chipping went sideways in " + c.chipping + " of your last rounds." : shortMiss + " short-game misses tapped lately.");
  if (c.contact || c.air) add("mirror", "Contact came up in your rounds. Setup causes most thin and fat shots — check it in the mirror.");
  const drMiss = data.shots.slice(0, 60).filter(s => s.clubId === "DR" && s.result === "missed").length;
  if (c.driver || drMiss >= 2) add("mirror", "Driver misses logged. Tee height, ball position and posture in the mirror first.");
  if (c.trouble) add("plan", "Trouble / lost balls came up. Plan the safe side at home.");
  return out;
}

function orderedHomeDrills() {
  const nudges = trendNudges();
  const fromFocus = [];
  focusList().forEach(a => (a.home || []).forEach(id => { if (!fromFocus.includes(id)) fromFocus.push(id); }));
  const ids = [];
  nudges.forEach(n => { if (!ids.includes(n.id)) ids.push(n.id); });
  fromFocus.forEach(id => { if (!ids.includes(id)) ids.push(id); });
  AT_HOME.forEach(d => { if (!ids.includes(d.id)) ids.push(d.id); });
  return ids.map(id => ({ d: AT_HOME.find(x => x.id === id), why: (nudges.find(n => n.id === id) || {}).why || "", focus: fromFocus.includes(id) })).filter(x => x.d);
}

/* ---- Budget ---- */
const ROUND_BUCKETS = [["2", "1–3"], ["6", "4–10"], ["15", "11–25"], ["30", "26+"]];
const GOALS = [["save", "Save", "Used, regrip, or keep"], ["value", "Value", "Last year's model / pre-owned"], ["nolimit", "No limit", "Newest + a fitting"]];
function goalOf() { return (data.budget && data.budget.goal) || ""; }
function roundsOf() { return Number(data.budget && data.budget.rounds) || 0; }
function budgetAdvice() {
  const r = roundsOf(), g = goalOf();
  if (!r && !g) return "Set rounds a year and a goal. Every club suggestion follows it.";
  const lines = [];
  if (r) {
    const perRound = Math.round(250 / (r * 5));
    if (r <= 3) lines.push("At about " + r + " rounds a year, a $250 club works out to about $" + perRound + " a round over 5 years. Regrip and keep first; buy one club at a time, used.");
    else if (r <= 10) lines.push("At " + r + "-ish rounds a year, a $250 club is about $" + perRound + " a round over 5 years. Last year's model is the sweet spot.");
    else if (r <= 25) lines.push("At " + r + "-ish rounds a year, a fitting starts to pay for itself. A $250 club is about $" + perRound + " a round over 5 years.");
    else lines.push("At " + r + "+ rounds a year, a proper fitting is worth it. A $250 club is about $" + perRound + " a round over 5 years.");
  }
  if (g === "save") lines.push("Save: " + CLUB_GUIDE.where.save);
  if (g === "value") lines.push("Value: " + CLUB_GUIDE.where.value);
  if (g === "nolimit") lines.push("No limit: " + CLUB_GUIDE.where.nolimit + (r && r <= 3 ? " At your rounds a year, the fitting matters more than the model year." : ""));
  return lines.join(" ");
}
function guideTypeFor(c) {
  if (!c) return null;
  return CLUB_GUIDE.types.find(t => t.ids.includes(c.id)) ||
    CLUB_GUIDE.types.find(t => (c.kind === "wood" && t.id === "fairway") || (c.kind === "hybrid" && t.id === "hybrid") || (c.kind === "iron" && t.id === "irons") || (c.kind === "wedge" && t.id === "wedges") || (c.kind === "putter" && t.id === "putter") || (c.kind === "driver" && t.id === "driver"));
}
function guideExamples(type, tier) {
  return (type && type[tier || goalOf() || "save"]) || [];
}
function shopLink(model, tier) {
  const q = encodeURIComponent(model.replace(/\s*\(.*\)/, "") + (tier === "save" ? " used" : tier === "value" ? " pre-owned" : ""));
  return tier === "save" ? "https://www.ebay.com/sch/i.html?_nkw=" + q : "https://www.google.com/search?q=" + q;
}

/* ---- Tune-up ---- */
function gripSizeAdvice() {
  const tu = data.tuneup || {};
  const hand = Number(tu.handIn);
  let size = "", why = "";
  if (hand > 0) {
    size = hand < 5 ? "Junior" : hand <= 6.5 ? "Undersize" : hand <= 7.5 ? "Standard" : hand <= 9 ? "Midsize" : "Jumbo";
    why = "Hand " + hand + "\" wrist crease to middle fingertip";
  } else if (tu.glove) {
    size = { S: "Undersize", M: "Standard", ML: "Standard", L: "Midsize", XL: "Midsize", XXL: "Jumbo" }[tu.glove] || "";
    why = "Glove " + ((GLOVE_SIZES.find(g => g[0] === tu.glove) || [])[1] || tu.glove);
  }
  return size ? { size, why } : null;
}
function staticFitNote() {
  const h = Number(data.golferHeightIn), w = Number((data.tuneup || {}).wristFloorIn);
  if (!h || !w) return "Add height and wrist-to-floor. Ping's color-code chart turns those two numbers into a starting length and lie.";
  const std = h >= 68 && h <= 73 && w >= 33 && w <= 35.5;
  return (std ? "Height " + h + "\" and wrist-to-floor " + w + "\" sit in the standard zone (Ping's chart example: 5'10\" with 34\" = standard length and lie). Standard clubs should fit; the sole and divot checks below confirm it."
    : "Height " + h + "\" and wrist-to-floor " + w + "\" are outside the usual standard zone (Ping's chart: 5'10\" / 34\" = standard; 5'6\" / 32\" = 1° flat and ½\" short). Look up your dot on the chart before paying for shop work — and trust the sole/divot photos over the chart.");
}
function clubLengthNote() {
  const tu = data.tuneup || {};
  const h = Number(data.golferHeightIn), l7 = Number(tu.len7), ld = Number(tu.lenDR);
  const out = [];
  if (l7) {
    let s = "7-iron " + l7 + "\" (a standard men's steel 7-iron is about 37\").";
    if (h && h >= 74 && l7 <= 37) s += " You're tall — if you hunch over it, ½\" longer may help.";
    else if (h && h <= 66 && l7 >= 37) s += " You're on the shorter side — if you choke down, it may be long.";
    out.push(s);
  }
  if (ld) out.push("Driver " + ld + "\" (G425 Max standard is about 45.75\"). " + (ld > 46 ? "Longer than standard: harder to find the face. Grip down an inch first (free)." : "Fine."));
  return out;
}
function tuneAns(id) { return ((data.tuneup || {}).answers || {})[id] || ""; }
function tuneupFixes() {
  const a = tuneAns;
  const free = [], regrip = [], shop = [], replace = [];
  const bagged = data.clubs.filter(c => c.inBag);
  // free setup changes
  if (a("arms") === "reach") free.push("You're reaching. Stand a half step closer so your arms hang straight down.");
  if (a("arms") === "crowd") free.push("You're crowded. Back up a little — a fist and a half between hands and thighs.");
  if (a("posture") === "hunch") free.push("Hunched: stand taller, bend from the hips, knees just soft.");
  if (a("posture") === "tall") free.push("Very upright: bend more from the hips so the arms can hang.");
  if (a("sole") === "toeup" || a("sole") === "heelup") free.push("Re-take the face-on photo after fixing posture — most lie problems at address are posture. Only if it's still off, see the shop list.");
  if (a("chokedown") === "yes") free.push("Choking down is a free fix that works. Keep doing it until you decide on a cut.");
  if (a("gripfit") === "dig" || a("gripfit") === "gap") free.push("Hold the grip in your fingers, not the palm, before blaming grip size.");
  // regrip
  const gs = gripSizeAdvice();
  const worn = a("gripwear") === "shiny" || a("gripwear") === "cracked" || data.bagAnswers.grips === "yes";
  const wornClubs = bagged.filter(c => (c.wear || {}).grip === "slick" || (c.wear || {}).grip === "cracked");
  if (worn) regrip.push("Regrip the whole bag (" + bagged.length + " clubs × " + TUNEUP_COSTS.regrip + ", about $" + bagged.length * 8 + "–$" + bagged.length * 15 + "). For 2–3 rounds a year this beats any new club.");
  else if (wornClubs.length) regrip.push("Regrip " + wornClubs.map(c => c.short).join(", ") + " (" + TUNEUP_COSTS.regrip + ").");
  if (a("gripfit") === "dig") regrip.push("Grips feel small (fingers dig in). Next regrip: go one size up" + (gs ? " — your hand says " + gs.size : " (midsize)") + ".");
  if (a("gripfit") === "gap") regrip.push("Grips feel big (fingers don't reach). Next regrip: one size down" + (gs ? " — your hand says " + gs.size : "") + ".");
  if (gs && (worn || wornClubs.length) && !a("gripfit")) regrip.push("Size to ask for: " + gs.size + " (" + gs.why + ").");
  // shop work
  const lie = a("sole") === "toeup" || a("marks") === "heel" ? "flatter" : (a("sole") === "heelup" || a("marks") === "toe" ? "more upright" : "");
  if (lie) shop.push("Lie angle: ask the shop to check and bend the irons " + lie + " (" + TUNEUP_COSTS.lie + "). " + (a("marks") === "toe" ? "Toe-side divots mean the lie is too flat." : a("marks") === "heel" ? "Heel-side divots mean the lie is too upright." : "Confirm with a face-tape or divot check first."));
  if (a("chokedown") === "yes" && a("arms") !== "crowd") shop.push("Length: you choke down on most clubs — a shop can cut about ½\" (" + TUNEUP_COSTS.length + "). Cutting makes the grip feel different; regrip at the same time.");
  if (a("posture") === "hunch" && a("chokedown") !== "yes" && Number(data.golferHeightIn) >= 74) shop.push("Length: tall and hunched — ask about ½\" longer (" + TUNEUP_COSTS.length + ").");
  const pa = putterLengthAdvice();
  if (pa && /too long/i.test(pa.title)) shop.push("Putter: " + pa.title + ". Have it cut (about $" + PRICE_GUIDE.putter_cut.low + "–$" + PRICE_GUIDE.putter_cut.high + ").");
  // replace — only when wear/miss/range data earns it
  bagged.filter(c => c.id !== "PU").forEach(c => {
    const v = costVerdict(c);
    if (!v.keep && !/regrip/i.test(v.title)) {
      const t = guideTypeFor(c);
      replace.push(c.name + ": " + v.why + (t ? " Look at a " + t.type.split(" (")[0].toLowerCase() + " in the Club guide." : ""));
    }
  });
  return { free, regrip, shop, replace };
}

/* Shrink photos before saving so localStorage doesn't fill up. */
function shrinkImage(file, cb, max) {
  const reader = new FileReader();
  reader.onload = () => {
    const src = reader.result;
    const img = new Image();
    img.onload = () => {
      try {
        const m = max || 900;
        const k = Math.min(1, m / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        cb(cv.toDataURL("image/jpeg", 0.72));
      } catch (e) { cb(src); }
    };
    img.onerror = () => cb(src);
    img.src = src;
  };
  reader.readAsDataURL(file);
}

/* ===================== render + events ===================== */

function speak(text) {
  if (!window.speechSynthesis) { alert("This phone has no speak-aloud. The line is already on screen."); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.92; u.lang = "en-US";
  window.speechSynthesis.speak(u);
}
function spoken(r) { return (r.club + ". " + r.tee + ". " + r.sentence).replace(/—/g, ". "); }
function go(screen) {
  ui.screen = screen;
  render();
  window.scrollTo(0, 0);
}

const SCREENS = {
  fresh, intro, home, card, ask, read, round, courses, course, pro, miss, bag, log, trends,
  tips, drills, checks, chipaid, scorecard, mybag, todaycheck, wear, clubedit, rangenums,
  learn, how, friend, focus, athome, cheatsheet
};
function render() {
  const el = document.getElementById("app");
  el.innerHTML = (SCREENS[ui.screen] || home)() + overlays();
}

window.SimpleCaddie = { recommend, baseRecommend, load, migrate, save, KEY, FRIEND_KEY, getData: () => data, getUi: () => ui,
  trustOf, trustedRanking, estimateFrom, applyQuickStart, courseHoles, SCORECARDS, driverBenched, replyFor, proPlan, trendStats,
  friendBag, friendPick, friendCardText, putterLengthAdvice, APP_VERSION,
  trendNudges, puttStats, orderedHomeDrills, tuneupFixes, gripSizeAdvice, budgetAdvice, CLUB_GUIDE, go };

function captureAsk() {
  const y = document.getElementById("yards");
  if (y) ui.ask.yards = y.value.trim();
  const course = document.querySelector("[data-field='courseId']");
  if (course) ui.ask.courseId = course.value;
  const hole = document.querySelector("[data-field='hole']");
  if (hole) ui.ask.hole = hole.value;
  const mc = document.getElementById("must-carry");
  if (mc) ui.ask.mustCarry = mc.checked;
  if (ui.ask.yards) ui.ask.mode = ui.ask.mode === "shaky" ? "shaky" : "";
}

function doRecommend() {
  captureAsk();
  if (!ui.ask.mode && !ui.ask.yards && !ui.ask.situation) { alert("Type the yards, or tap Don't know."); return; }
  if (ui.ask.yards && !/^\d+$/.test(ui.ask.yards)) { alert("Yards as a number, or tap Don't know."); return; }
  const rec = recommend(ui.ask);
  ui.read = Object.assign({}, rec, { ask: Object.assign({}, ui.ask), result: "" });
  ui.reply = null;
  data.lastRead = ui.read;
  save();
  go("read");
}

function logResult(result) {
  const r = ui.read || data.lastRead;
  if (!r) return;
  if (!data.live || data.live.date !== today()) ensureLive();
  r.result = result;
  data.lastRead = r;
  const c = clubById(r.clubId);
  if (c) { if (result === "hit") c.hits = (c.hits || 0) + 1; else c.misses = (c.misses || 0) + 1; }
  data.shots.unshift({ date: today(), ts: Date.now(), club: r.club, clubId: r.clubId, tee: r.tee, sentence: r.sentence, result, ask: r.ask });
  data.shots = data.shots.slice(0, 1500);
  save();
  ui.reply = replyFor(result, r);
  render();
}

function saveRound() {
  const scoreEl = document.getElementById("score");
  const courseEl = document.getElementById("round-course");
  const noteEl = document.getElementById("round-note");
  const course = data.courses.find(c => c.id === (courseEl && courseEl.value));
  const live = data.live && data.live.date === today() ? data.live : null;
  const lt = liveTotals();
  const holes = live ? live.holes.filter(h => h.strokes || h.putts || h.pen) : [];
  data.rounds.unshift({
    date: today(), ts: Date.now(),
    score: scoreEl ? scoreEl.value.trim() : "",
    courseId: courseEl ? courseEl.value : "", course: course ? course.name : "",
    tee: course && course.tee || "",
    sideways: ui.round.sideways.slice(),
    note: noteEl ? noteEl.value.trim() : "",
    holes,
    // only call it a partial round when the score itself came from a part-filled card
    holesPlayed: live && lt.holes && scoreEl && Number(scoreEl.value) === lt.strokes ? lt.holes : null,
    putts: live && lt.putts ? lt.putts : null, pens: live ? lt.pens : null
  });
  ui.round = { score: "", courseId: "", sideways: [], note: "" };
  data.live = null;
  data.phoneDay = null;
  save();
  const t = trendStats();
  ui.flash = "Round logged." + (t.top ? " Most-named problem so far: " + sidewaysLabel(t.top) + ". Your 20-minute home drill is below." : "");
  go("trends");
}

function startRange() {
  ui.rangeStep = 0; ui.rangeYards = ""; ui.repTip = ""; ui.thinRun = 0;
  ui.rangeClubs = WARMUP.filter(id => { const c = clubById(id); return c && c.inBag; });
  if (!ui.rangeClubs.length) ui.rangeClubs = data.clubs.filter(c => c.inBag && c.id !== "PU").slice(0, 1).map(c => c.id);
  ui.rangeCounts = {};
  ui.rangeClubs.forEach(id => { ui.rangeCounts[id] = { straight: 0, left: 0, right: 0, thin: 0, yards: [] }; });
  go("pro");
}
function logRep(kind) {
  const id = ui.rangeClubs[ui.rangeStep];
  const bucket = ui.rangeCounts[id];
  bucket[kind] += 1;
  const y = document.getElementById("range-yards");
  if (y && kind === "straight" && /^\d+$/.test(y.value.trim())) { bucket.yards.push(Number(y.value.trim())); ui.rangeYards = y.value.trim(); }
  const c = clubById(id);
  if (kind === "straight") c.straights = (c.straights || 0) + 1;
  if (kind === "left") c.lefts = (c.lefts || 0) + 1;
  if (kind === "right") c.rights = (c.rights || 0) + 1;
  if (kind === "thin") c.thins = (c.thins || 0) + 1;
  ui.thinRun = kind === "thin" ? ui.thinRun + 1 : 0;
  ui.repTip = pickOne(REP_TIPS[kind], bucket.straight + bucket.left + bucket.right + bucket.thin);
  save();
  render();
}
function switchRangeClub(id) {
  const y = document.getElementById("range-yards");
  if (y) ui.rangeYards = "";
  if (!ui.rangeClubs.includes(id)) {
    ui.rangeClubs.splice(ui.rangeStep + 1, 0, id);
    ui.rangeCounts[id] = { straight: 0, left: 0, right: 0, thin: 0, yards: [] };
  }
  ui.rangeStep = ui.rangeClubs.indexOf(id);
  ui.repTip = ""; ui.thinRun = 0;
  render();
}
function nextClub() {
  const id = ui.rangeClubs[ui.rangeStep];
  const bucket = ui.rangeCounts[id];
  const y = document.getElementById("range-yards");
  if (y && /^\d+$/.test(y.value.trim()) && bucket.yards.length === 0 && bucket.straight > 0) bucket.yards.push(Number(y.value.trim()));
  applyRangeClub(id, bucket);
  ui.repTip = ""; ui.thinRun = 0;
  if (ui.rangeStep < ui.rangeClubs.length - 1) { ui.rangeStep += 1; ui.rangeYards = ""; render(); return; }
  const total = ui.rangeClubs.reduce((n, cid) => { const b = ui.rangeCounts[cid]; return n + b.straight + b.left + b.right + b.thin; }, 0);
  data.rangeSessions.unshift({ date: today(), total, counts: ui.rangeCounts });
  fillEstimates();
  save();
  const pending = data.clubs.filter(c => c.rangePending).map(c => c.short);
  ui.rangeCounts = null;
  ui.flash = "Session logged: " + total + " reps. Range numbers replaced guesses." + (pending.length ? " Your own numbers kept for " + pending.join(", ") + " — tap Range numbers to use the range ones." : "");
  go("pro");
}

function finishFresh(skip) {
  const f = ui.fresh;
  const d = empty();
  d.clubs.forEach(c => { c.brand = ""; c.keeper = false; c.searchModel = c.name; });
  if (!skip) {
    d.clubs.forEach(c => { c.inBag = c.id === "PU" || f.clubs.includes(c.id); });
    d.courses = d.courses.filter(c => f.courses.includes(c.id));
    const nm = (f.newCourse || "").trim();
    if (nm) d.courses.push({ id: "c" + Date.now(), name: nm, place: "", notes: "", greens: { speed: "medium", firm: "medium", slope: "some", size: "medium" }, holes: Array.from({ length: 18 }, (_, i) => ({ n: i + 1, par: 4, yards: "", notes: "" })), holeEdits: {}, preset: false, source: "hand" });
  }
  d.seenIntro = true;
  d.whatsNewSeen = "3.0";
  d.freshStart = today();
  data = d;
  if (!skip && (f.never || Number(f.carry) > 0)) applyQuickStart(f.clubId, f.carry, f.never);
  save();
  ui.flash = "You're set. On the course, tap Caddie.";
  go("home");
}

document.getElementById("app").addEventListener("click", (e) => {
  const t = e.target.closest("[data-go],[data-act],[data-mode],[data-group],[data-course],[data-bag]");
  if (!t) return;
  if (t.dataset.stop && !e.target.closest("[data-act]")) return;
  if (t.dataset.go) {
    if (ui.screen === "ask") captureAsk();
    if (t.dataset.go === "bag" || t.dataset.go === "mybag") ui.bagPanel = "main";
    if (t.dataset.go === "clubedit" && t.dataset.edit) { ui.myBagEditId = t.dataset.edit; ui.clubeditBack = ui.screen === "bag" ? "bag" : "mybag"; }
    if (t.dataset.go === "focus") ui.focusBack = t.dataset.back || "home";
    if (t.dataset.go === "ask") ui.reply = null;
    go(t.dataset.go);
    return;
  }
  if (t.dataset.course) {
    const c = data.courses.find(x => x.id === t.dataset.course);
    ui.courseEdit = JSON.parse(JSON.stringify(c));
    if (!ui.courseEdit.greens) ui.courseEdit.greens = { speed: "medium", firm: "medium", slope: "some", size: "medium" };
    go("course");
    return;
  }
  if (t.dataset.mode) {
    captureAsk();
    ui.ask.mode = ui.ask.mode === t.dataset.mode ? "" : t.dataset.mode;
    if (ui.ask.mode === "unknown") ui.ask.yards = "";
    render();
    return;
  }
  if (t.dataset.group) { captureAsk(); ui.ask[t.dataset.group] = t.dataset.value; render(); return; }
  if (t.dataset.bag) { const c = clubById(t.dataset.bag); c.inBag = !c.inBag; save(); render(); return; }

  const act = t.dataset.act;
  switch (act) {
    case "seen-intro": data.seenIntro = true; save(); go("home"); break;
    case "fresh-next": captureFresh(); if (ui.fresh.step === 2 && !ui.fresh.never && ui.fresh.carry && !/^\d+$/.test(ui.fresh.carry)) { alert("Yards as a number."); break; } ui.fresh.step = Math.min(3, ui.fresh.step + 1); go("fresh"); break;
    case "fresh-back": captureFresh(); ui.fresh.step = Math.max(0, ui.fresh.step - 1); go("fresh"); break;
    case "fresh-skip": finishFresh(true); break;
    case "fresh-club": { const f = ui.fresh; const id = t.dataset.id; f.clubs = f.clubs.includes(id) ? f.clubs.filter(x => x !== id) : f.clubs.concat(id); render(); break; }
    case "fresh-never": captureFresh(); ui.fresh.never = !ui.fresh.never; render(); break;
    case "fresh-finish": captureFresh(); finishFresh(false); break;
    case "pocket-hole": bumpPhone(); { const l = ensureLive(); l.hole = Math.min(18, l.hole + 1); save(); } go("card"); break;
    case "hole-prev": case "hole-next": { const l = ensureLive(); l.hole = clamp(l.hole + (act === "hole-next" ? 1 : -1), 1, 18); save(); render(); break; }
    case "tee-read": {
      const course = data.courses.find(c => c.id === data.activeCourseId);
      const l = ensureLive();
      const h = courseHoles(course).find(x => x.n === l.hole);
      ui.ask = Object.assign(ui.ask, { yards: h && h.yards ? String(h.yards) : "", mode: "", lie: "tee", hill: "flat", tilt: "level", courseId: course ? course.id : "", hole: String(l.hole), mustCarry: false, situation: "" });
      ui.reply = null;
      go("ask");
      break;
    }
    case "yd": { captureAsk(); const n = (Number(ui.ask.yards) || 0) + Number(t.dataset.d); ui.ask.yards = n > 0 ? String(clamp(n, 5, 350)) : ""; ui.ask.mode = ui.ask.mode === "shaky" ? "shaky" : ""; render(); break; }
    case "ydset": captureAsk(); ui.ask.yards = String(t.dataset.y); if (ui.ask.mode === "unknown") ui.ask.mode = ""; if (t.dataset.lie) ui.ask.lie = t.dataset.lie; render(); break;
    case "recommend": doRecommend(); break;
    case "situ": {
      captureAsk();
      ui.ask.situation = t.dataset.situ;
      if ((t.dataset.situ === "roll" || t.dataset.situ === "loft") && !ui.ask.yards) ui.ask.yards = "20";
      if (t.dataset.situ === "loft") ui.ask.mustCarry = true;
      doRecommend();
      ui.ask.situation = "";
      break;
    }
    case "speak": { const r = ui.read || data.lastRead; if (r) speak(spoken(r)); break; }
    case "speak-text": speak(t.dataset.text || ""); break;
    case "result": logResult(t.dataset.result); break;
    case "next-shot": ui.reply = null; ui.ask.yards = ""; ui.ask.mode = ""; ui.ask.situation = ""; ui.ask.mustCarry = false; if (ui.ask.lie === "tee") ui.ask.lie = "fairway"; go("ask"); break;
    case "one-thing": { let n; do { n = pickOne(ONE_THINGS); } while (ONE_THINGS.length > 1 && n === ui.oneThing); ui.oneThing = n; render(); break; }
    case "one-thing-close": if (e.target.closest("[data-stop]") && t.classList.contains("overlay")) break; ui.oneThing = null; render(); break;
    case "copy-close": ui.copyText = null; render(); break;
    case "unbench": data.driverUnbench = { date: today(), start: roundStartTs(), base: driverMissesThisRound() }; save(); render(); break;
    case "save-round": saveRound(); break;
    case "new-course": {
      ui.courseEdit = { id: "c" + Date.now(), name: "", place: "Michigan", notes: "", greens: { speed: "medium", firm: "medium", slope: "some", size: "medium" }, holes: Array.from({ length: 18 }, (_, i) => ({ n: i + 1, par: 4, yards: "", notes: "" })), holeEdits: {}, preset: false };
      go("course");
      break;
    }
    case "save-course": saveCourse(); break;
    case "delete-course":
      if (!confirm("Remove this course card?")) break;
      data.courses = data.courses.filter(c => c.id !== ui.courseEdit.id);
      if (data.activeCourseId === ui.courseEdit.id) data.activeCourseId = "";
      save(); go("courses"); break;
    case "add-18": ui.courseEdit.holes = Array.from({ length: 18 }, (_, i) => ({ n: i + 1, par: 4, yards: "", notes: "" })); render(); break;
    case "set-active": data.activeCourseId = t.dataset.id; ui.ask.courseId = t.dataset.id; if (data.live && data.live.date === today()) data.live.courseId = t.dataset.id; save(); render(); break;
    case "green-tap": ui.courseEdit.greens[t.dataset.gg] = t.dataset.gv; captureCourseEdit(); render(); break;
    case "tee-pick": captureCourseEdit(); ui.courseEdit.tee = t.dataset.tee; render(); break;
    case "start-range": startRange(); break;
    case "rep": logRep(t.dataset.rep); break;
    case "next-club": nextClub(); break;
    case "save-note": {
      const n = document.getElementById("pro-note");
      const v = n ? n.value.trim() : "";
      if (!v) break;
      data.notes = [{ date: today(), text: v }].concat(data.notes || []).slice(0, 50);
      if (data.rangeSessions[0] && data.rangeSessions[0].date === today()) data.rangeSessions[0].note = v;
      save(); ui.flash = "Note saved."; render(); break;
    }
    case "save-rangenum": {
      const inp = document.querySelector(`[data-rn="${t.dataset.id}"]`);
      const nums = (inp ? inp.value : "").split(/[^0-9]+/).map(Number).filter(n => n >= 5 && n <= 400);
      if (!nums.length) { alert("Type one or more yardages, like 150, 148."); break; }
      const res = applyRangeClub(t.dataset.id, { yards: nums });
      const c = res && res.club;
      if (c) c.straights = (c.straights || 0) + nums.length;
      save(); render(); break;
    }
    case "use-range": useRangeNumber(t.dataset.id); render(); break;
    case "quick-start": {
      const cl = document.getElementById("q-club"), ca = document.getElementById("q-carry");
      ui.quick = { clubId: cl ? cl.value : "7I", carry: ca ? ca.value.trim() : "" };
      if (!/^\d+$/.test(ui.quick.carry)) { alert("Type how far that club carries, in yards."); break; }
      const n = applyQuickStart(ui.quick.clubId, ui.quick.carry, false);
      ui.flash = "Guessed " + n + " clubs from your " + (clubById(ui.quick.clubId) || {}).name + ". Mine and range numbers were left alone.";
      render(); break;
    }
    case "open-how": ui.howId = t.dataset.id; ui.howBack = t.dataset.back || "learn"; go("how"); break;
    case "learn-tab": ui.learnTab = t.dataset.tab; render(); break;
    case "share-simplify": shareText("Simplify the game", simplifyText()); break;
    case "go-putter": ui.bagPanel = "putter"; go("bag"); break;
    case "export": exportBackup(); break;
    case "export-area": {
      const pre = document.getElementById("backup-pre"), ta = document.getElementById("import-text"), btn = document.getElementById("btn-import-paste");
      if (pre) { pre.style.display = "block"; pre.textContent = JSON.stringify(data, null, 2); }
      if (ta) { ta.style.display = "block"; ta.value = ""; }
      if (btn) btn.style.display = "block";
      break;
    }
    case "import-paste": {
      const ta = document.getElementById("import-text");
      try { const parsed = JSON.parse(ta.value); if (!parsed.clubs) throw new Error("bad"); data = migrate(parsed); save(); alert("Backup restored on this phone."); go("home"); }
      catch (err) { alert("That paste is not a Simple Caddie backup."); }
      break;
    }
    case "bag-panel": ui.bagPanel = t.dataset.panel; if (t.dataset.panel === "main") go("bag"); else { ui.screen = "bag"; render(); window.scrollTo(0, 0); } break;
    case "bag-ans": data.bagAnswers[t.dataset.qid] = t.dataset.ans; save(); render(); break;
    case "chipview": ui.chipView = t.dataset.view; render(); break;
    case "open-wear": ui.wearClubId = t.dataset.id; ui.wearBack = t.dataset.back || "bag"; go("wear"); break;
    case "wear-tap": { const c = clubById(t.dataset.id); if (c) { if (!c.wear) c.wear = {}; c.wear[t.dataset.field] = t.dataset.val; save(); render(); } break; }
    case "save-todaycheck": {
      const iron = document.getElementById("tc-iron"), ironY = document.getElementById("tc-iron-y"), wood = document.getElementById("tc-wood"), woodY = document.getElementById("tc-wood-y");
      data.todayCheck = Object.assign({}, data.todayCheck, { ironId: iron ? iron.value : "7I", ironToday: ironY ? ironY.value.trim() : "", woodId: wood ? wood.value : "HY", woodToday: woodY ? woodY.value.trim() : "" });
      computeTodayCheck(); render(); break;
    }
    case "save-putter": {
      const len = document.getElementById("putter-len"), h = document.getElementById("golfer-h");
      data.putterLengthIn = len ? len.value.trim() : ""; data.golferHeightIn = h ? h.value.trim() : "";
      save(); ui.bagPanel = "putter"; render(); break;
    }
    case "add-custom-club": {
      const id = "X" + Date.now();
      data.clubs.push(freshClub({ id, name: "Custom club", short: "Custom", yards: 100, forgiving: true, kind: "iron", brand: "", inBag: true, source: "mine", straights: 0, lefts: 0, rights: 0, thins: 0, hits: 0, misses: 0, startHere: false }));
      save(); ui.myBagEditId = id; go("clubedit"); break;
    }
    case "save-clubedit": {
      const c = clubById(ui.myBagEditId);
      if (c) {
        const n = document.getElementById("ce-name"), s = document.getElementById("ce-short"), y = document.getElementById("ce-yards"), m = document.getElementById("ce-model");
        if (n) c.name = n.value.trim() || c.name;
        if (s) c.short = s.value.trim() || c.short;
        if (m) c.searchModel = m.value.trim();
        if (y && Number(y.value) > 0 && Math.round(Number(y.value)) !== c.yards) setMine(c.id, Number(y.value));
        else if (y && Number(y.value) > 0 && c.source === "guess") setMine(c.id, Number(y.value));
        save();
      }
      go(ui.clubeditBack || "mybag"); break;
    }
    case "delete-club":
      if (!confirm("Remove this custom club?")) break;
      data.clubs = data.clubs.filter(c => c.id !== t.dataset.id); save(); go(ui.clubeditBack || "mybag"); break;
    // ---- v3 ----
    case "whatsnew-ok": data.whatsNewSeen = "3.0"; save(); render(); break;
    case "focus-toggle": {
      const id = t.dataset.id; const f = data.focus || [];
      data.focus = f.includes(id) ? f.filter(x => x !== id) : f.concat(id);
      ui.learnTab = null; save(); render(); break;
    }
    case "focus-clear": data.focus = []; ui.learnTab = null; save(); render(); break;
    case "go-athome": ui.athomeBack = t.dataset.back || "pro"; go("athome"); break;
    case "home-done": {
      data.homeDrillLog = [{ date: today(), id: t.dataset.id }].concat(data.homeDrillLog || []).slice(0, 200);
      save(); ui.flash = "Logged. That's practice — it counts."; render(); break;
    }
    case "budget-rounds": data.budget = Object.assign({}, data.budget, { rounds: data.budget && data.budget.rounds === t.dataset.v ? "" : t.dataset.v }); save(); render(); break;
    case "budget-goal": data.budget = Object.assign({}, data.budget, { goal: data.budget && data.budget.goal === t.dataset.v ? "" : t.dataset.v }); ui.guideTier = null; save(); render(); break;
    case "guide-tier": ui.guideTier = t.dataset.v; render(); break;
    case "tune-glove": captureTune(); data.tuneup.glove = data.tuneup.glove === t.dataset.v ? "" : t.dataset.v; save(); render(); break;
    case "tune-ans": {
      captureTune();
      const a = data.tuneup.answers; a[t.dataset.qid] = a[t.dataset.qid] === t.dataset.v ? "" : t.dataset.v;
      save(); render(); break;
    }
    case "tune-save": captureTune(); save(); ui.flash = "Measurements saved."; render(); break;
    // ---- Help a friend ----
    case "friend-new": {
      captureFriend();
      const f = { id: "f" + Date.now(), name: "", never: false, clubId: "7I", carry: "", pick: null };
      friends.friends.push(f); friends.activeId = f.id; ui.friend = { yards: "", mode: "" }; saveFriends(); render(); break;
    }
    case "friend-sel": captureFriend(); friends.activeId = t.dataset.id; ui.friend = { yards: "", mode: "" }; saveFriends(); render(); break;
    case "friend-mode": captureFriend(); { const f = activeFriend(); if (f) { f.never = t.dataset.never === "1"; f.pick = null; } } saveFriends(); render(); break;
    case "friend-save": captureFriend(); { const f = activeFriend(); if (f) f.pick = null; } saveFriends(); render(); break;
    case "friend-yd": { captureFriend(); const n = (Number(ui.friend.yards) || 0) + Number(t.dataset.d); ui.friend.yards = n > 0 ? String(clamp(n, 5, 350)) : ""; ui.friend.mode = ""; render(); break; }
    case "friend-ydset": captureFriend(); ui.friend.yards = t.dataset.y; ui.friend.mode = ""; render(); break;
    case "friend-unknown": captureFriend(); ui.friend.mode = ui.friend.mode === "unknown" ? "" : "unknown"; if (ui.friend.mode) ui.friend.yards = ""; render(); break;
    case "friend-pick": {
      captureFriend();
      const f = activeFriend(); if (!f) break;
      if (!ui.friend.yards && ui.friend.mode !== "unknown") { alert("Type the yards, or tap Don't know."); break; }
      f.pick = friendPick(f, ui.friend.yards, ui.friend.mode === "unknown");
      if (ui.friend.yards) f.pick.line = ui.friend.yards + " yds: " + f.pick.line;
      saveFriends(); render(); break;
    }
    case "friend-share": captureFriend(); { const f = activeFriend(); if (f) shareText("Simple Caddie card", friendCardText(f)); } break;
    case "friend-del": {
      const f = activeFriend(); if (!f || !confirm("Remove " + (f.name || "this friend") + "?")) break;
      friends.friends = friends.friends.filter(x => x.id !== f.id); friends.activeId = friends.friends[0] ? friends.friends[0].id : ""; saveFriends(); render(); break;
    }
    default: break;
  }
});

/* Tune-up inputs: keep typed numbers across re-renders. */
function captureTune() {
  if (!data.tuneup) data.tuneup = { answers: {}, photos: {} };
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : null; };
  const h = v("tu-height"); if (h != null) data.golferHeightIn = h;
  const w = v("tu-wrist"); if (w != null) data.tuneup.wristFloorIn = w;
  const hand = v("tu-hand"); if (hand != null) data.tuneup.handIn = hand;
  const l7 = v("tu-len7"); if (l7 != null) data.tuneup.len7 = l7;
  const ld = v("tu-lendr"); if (ld != null) data.tuneup.lenDR = ld;
  const pu = v("tu-putter"); if (pu != null) data.putterLengthIn = pu;
}

function captureCourseEdit() {
  const c = ui.courseEdit; if (!c) return;
  const n = document.getElementById("course-name"); if (n) c.name = n.value;
  const p = document.getElementById("course-place"); if (p) c.place = p.value;
  const no = document.getElementById("course-notes"); if (no) c.notes = no.value;
  // remember typed hole values across re-render
  const typed = {};
  document.querySelectorAll("[data-hyards]").forEach(inp => { typed[inp.dataset.hyards] = Object.assign(typed[inp.dataset.hyards] || {}, { yards: inp.value.trim() }); });
  document.querySelectorAll("[data-hnotes]").forEach(inp => { typed[inp.dataset.hnotes] = Object.assign(typed[inp.dataset.hnotes] || {}, { notes: inp.value.trim() }); });
  document.querySelectorAll("[data-hpar]").forEach(inp => { typed[inp.dataset.hpar] = Object.assign(typed[inp.dataset.hpar] || {}, { par: Number(inp.value) }); });
  c._typed = typed;
}

function saveCourse() {
  const c = ui.courseEdit;
  captureCourseEdit();
  const name = (c.name || "").trim();
  if (!name) { alert("Name the course."); return; }
  const sc = SCORECARDS[c.id];
  const typed = c._typed || {};
  const next = Object.assign({}, c, { name, place: (c.place || "").trim(), notes: (c.notes || "").trim(), greens: Object.assign({}, c.greens) });
  delete next._typed;
  if (sc) {
    // what the card says for this tee; only differences are stored as your edits
    const cardHoles = courseHoles(Object.assign({}, next, { holeEdits: {} }));
    const edits = {};
    cardHoles.forEach(h => {
      const ty = typed[h.n] || {};
      const y = ty.yards != null ? ty.yards : "";
      const notes = ty.notes || "";
      const e = {};
      if (y && y !== h.card) { e.yards = y; e.par = h.par; }
      if (notes) e.notes = notes;
      if (Object.keys(e).length) edits[h.n] = e;
    });
    next.holeEdits = edits;
  } else {
    next.holes = (c.holes || []).map(h => {
      const ty = typed[h.n] || {};
      return { n: h.n, par: ty.par || h.par, yards: ty.yards != null ? ty.yards : (h.yards || ""), notes: ty.notes != null ? ty.notes : (h.notes || "") };
    });
  }
  const i = data.courses.findIndex(x => x.id === next.id);
  if (i >= 0) data.courses[i] = next; else data.courses.push(next);
  save();
  go("courses");
}

document.getElementById("app").addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "must-carry") { ui.ask.mustCarry = t.checked; return; }
  if (t.id === "range-switch") { switchRangeClub(t.value); return; }
  if (t.id === "live-course") { const l = ensureLive(); l.courseId = t.value; if (t.value) data.activeCourseId = t.value; save(); render(); return; }
  if (t.dataset.freshCourse) {
    const f = ui.fresh; const id = t.dataset.freshCourse;
    f.courses = t.checked ? f.courses.concat(id) : f.courses.filter(x => x !== id);
    return;
  }
  if (t.dataset.field) {
    captureAsk();
    ui.ask[t.dataset.field] = t.value;
    if (t.dataset.field === "courseId") {
      data.activeCourseId = t.value;
      ui.ask.hole = "";
      save();
    }
    render();
    return;
  }
  if (t.dataset.yards) { const n = Number(t.value); if (n > 0) setMine(t.dataset.yards, n); return; }
  if (t.dataset.model) { const c = clubById(t.dataset.model); if (c) { c.searchModel = t.value.trim(); save(); } return; }
  if (/^tu-/.test(t.id || "")) { captureTune(); save(); return; }
  if (t.dataset.tunePhoto && t.files && t.files[0]) {
    const id = t.dataset.tunePhoto; captureTune();
    readImageFile(t.files[0], (url) => { if (!data.tuneup.photos) data.tuneup.photos = {}; data.tuneup.photos[id] = url; save(); render(); });
    return;
  }
  if (t.id === "bag-photo-input" && t.files && t.files[0]) { readImageFile(t.files[0], (url) => { data.bagPhoto = url; save(); render(); }); return; }
  if (t.dataset.clubPhoto && t.files && t.files[0]) { const c = clubById(t.dataset.clubPhoto); readImageFile(t.files[0], (url) => { if (c) { c.photo = url; save(); render(); } }); return; }
  if (t.dataset.wearPhoto && t.files && t.files[0]) {
    const c = clubById(t.dataset.wearPhoto); const field = t.dataset.wearField;
    readImageFile(t.files[0], (url) => { if (c) { if (!c.wearPhotos) c.wearPhotos = {}; c.wearPhotos[field] = url; save(); render(); } });
    return;
  }
  if (t.dataset.side) {
    const id = t.dataset.side;
    if (t.checked) { if (!ui.round.sideways.includes(id)) ui.round.sideways.push(id); }
    else ui.round.sideways = ui.round.sideways.filter(x => x !== id);
    const s = document.getElementById("score"); if (s) ui.round.score = s.value.trim();
    return;
  }
  if (t.dataset.sc) {
    const l = ensureLive();
    const h = l.holes.find(x => String(x.n) === t.dataset.sc);
    if (h) {
      if (t.dataset.scf === "pen") h.pen = t.checked; else h[t.dataset.scf] = t.value.trim();
      if (t.dataset.scf === "strokes" && Number(t.value) > 0) l.hole = Math.min(18, h.n + 1);
      save();
    }
    return;
  }
  if (t.id === "import-file" && t.files && t.files[0]) importBackup(t.files[0]);
});

function readImageFile(file, cb) {
  // v3: photos are shrunk (max 900px JPEG) so a few of them can't fill the phone's storage.
  shrinkImage(file, cb, 900);
}
function exportBackup() {
  const blob = JSON.stringify(data, null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(blob).then(() => alert("Backup copied. Paste it into a note.")).catch(() => download(blob));
  } else download(blob);
}
function download(text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = "simple-caddie-backup.json";
  a.click();
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed.clubs) throw new Error("not a caddie backup");
      data = migrate(parsed); save();
      alert("Backup restored on this phone.");
      go("home");
    } catch (e) { alert("That file is not a Simple Caddie backup."); }
  };
  reader.readAsText(file);
}

/* Installable app: only when served over http(s). Opening the single file from
   Files (file://) skips all of this, so nothing errors offline. */
(function pwa() {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const add = (rel, href, extra) => { const l = document.createElement("link"); l.rel = rel; l.href = href; if (extra) Object.assign(l, extra); document.head.appendChild(l); };
    add("manifest", "manifest.webmanifest");
    add("apple-touch-icon", "icons/apple-touch-icon.png");
    add("icon", "icons/icon-192.png", { type: "image/png" });
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
    }
  } catch (e) { /* not fatal */ }
})();

render();
</script>
