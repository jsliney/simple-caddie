p{margin:6px 0}
button,.btn,select,input{font:inherit}

label{display:block;font-weight:600;margin:8px 0 4px}

.tag{font-style:italic;color:var(--mut);margin:0;font-size:16px}

/* Club master list. kind drives the caddie rules. */
const CLUBS = [
  ["DR","Driver","driver"],["3W","3-wood","wood"],["5W","5-wood","wood"],["HY","Hybrid","hybrid"],

];
const SHORT = { DR:"Driver","3W":"3-wood","5W":"5-wood",HY:"Hybrid","4I":"4-iron","5I":"5-iron","6I":"6-iron","7I":"7-iron","8I":"8-iron","9I":"9-iron",PW:"PW",AW:"Gap wedge","52":"52°","54":"54°","56":"56°",SW:"Sand wedge","58":"58°",PU:"Putter" };
/* Default carries (yards). Sources:
   - average: Shot Scope amateur averages for a ~20 handicap (Driver 225, 3W 195, Hybrid 180, 6i 151, 7i 146, 8i 138,

     (Driver 180, 5W 150, Hybrid 145, 6i 120, 7i 110, 8i 100, 9i 90, PW 80, GW 60, SW 55, LW 40).

const PRESET = {

const RATIO = id => PRESET.average[id] / PRESET.average["7I"];

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function makeClubs(swing, bagIds) {
  const p = PRESET[swing] || PRESET.beginner;
  return CLUBS.map(([id, name, kind]) => ({ id, name, kind, yards: p[id], source: "guess", inBag: bagIds.includes(id), brand: "" }));
}
function blank() {
  return { v: 1, setupDone: false, name: "", swing: "beginner", clubs: makeClubs("beginner", DEFAULT_BAG),
    courses: COURSES.filter(c => !c.extra).map(c => ({ id: c.id, preset: true, tee: c.tee })), activeCourseId: "",

}
function normalize(d) {
  const b = blank();
  const o = Object.assign(b, d || {});
  const have = {}; (o.clubs || []).forEach(c => { have[c.id] = c; });
  o.clubs = CLUBS.map(([id, name, kind]) => {
    const c = have[id] || { yards: PRESET.beginner[id], source: "guess", inBag: false, brand: "" };
    return { id, name, kind, yards: Math.max(0, Math.min(400, Number(c.yards) || 0)), source: ["guess","mine","range"].includes(c.source) ? c.source : "guess", inBag: !!c.inBag, brand: String(c.brand || "") };
  });
  ["courses","rounds","legacyFriends"].forEach(k => { if (!Array.isArray(o[k])) o[k] = []; });
  if (!o.drills || typeof o.drills !== "object") o.drills = {};
  if (!o.fit || typeof o.fit !== "object") o.fit = {};
  if (!o.miss || typeof o.miss !== "object") o.miss = null;

/* v1.3 trim: keep the big three up front; drop drills that repeat another picture. */
const DROPPED = ["p-tech", "p-ladder", "c-one", "c-club", "s-align", "s-ball"];
const ORDER = { putt: ["p-lag", "p-line", "p-gate", "p-three", "p-seq"] };
PATH.forEach(g => { g.drills = g.drills.filter(d => !DROPPED.includes(d.id)); if (ORDER[g.id]) g.drills.sort((a, b) => ORDER[g.id].indexOf(a.id) - ORDER[g.id].indexOf(b.id)); });
const ALL_DRILLS = PATH.flatMap(p => p.drills);
function drillAvg(id) { const a = D.drills[id]; if (!a || !a.length) return null; const l = a.slice(-3); return l.reduce((s, x) => s + x, 0) / l.length; }
function nextFocus(id, score) {
  const i = ALL_DRILLS.findIndex(d => d.id === id), nx = ALL_DRILLS[i + 1];
  if (score <= 4) return "Stay on this one. Make it easier (shorter, slower) and try again next time.";
  if (score <= 7) return "Good. Do it once more next time, then move on.";
  return nx ? `Nailed it. Next up: ${nx.title}.` : "Nailed it. Go play!";
}
function pickToday() {
  const untried = ALL_DRILLS.filter(d => drillAvg(d.id) == null && (d.id.startsWith("p") || d.id.startsWith("c")));
  if (untried.length) return untried[0];
  return ALL_DRILLS.slice().sort((a, b) => (drillAvg(a.id) ?? 99) - (drillAvg(b.id) ?? 99))[0];
}

function warmSteps(min, balls) {
  const b = Number(balls) || 0;
  const share = (f) => b ? ` (${Math.max(1, Math.round(b * f))} balls)` : "";
  const plans = {
    5: [["Stretch", "Arm circles, hip turns, 5 slow swings holding two clubs."], ["Half wedges", "5 easy half swings. Find the middle of the face." + share(.4)], ["Mid iron", "3 smooth 7-irons." + share(.35)], ["Drivers last", "2 drivers at 80%." + share(.25)], ["Putting", "3 long lag putts, then 3 three-footers. Finish on a made short one."]],
    10: [["Stretch", "2 minutes: arm circles, hip turns, slow swings holding two clubs."], ["Half wedges", "8 half swings, then 2 full." + share(.35)], ["Mid iron", "6 smooth 7-irons at a target." + share(.3)], ["Hybrid", "3 easy hybrids." + share(.15)], ["Drivers last", "3 drivers at 80%. Full routine on the last one." + share(.2)], ["Putting", "3 lag putts (30 ft), then 3-footers until you make 5. Finish on a short one."]],
    20: [["Stretch", "3 minutes: arm circles, hip turns, lunges, slow swings with two clubs."], ["Chips", "5 chips with the 8-iron, 5 with the wedge."], ["Half wedges", "10 half swings, then 5 full." + share(.3)], ["Mid iron", "10 7-irons. Clubs on the ground for alignment." + share(.3)], ["Hybrid / wood", "5 easy ones." + share(.15)], ["Drivers last", "5 drivers. Play the first hole on the last 2." + share(.25)], ["Putting", "5 minutes: 3 lag putts from 30+ ft, then 3-footer circle. Finish on short ones."]]
  };
  return plans[min] || plans[10];
}

function isIOS() { return /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }

  if ((has("4I") || has("5I")) && !has("HY")) out.push("Swap the 4/5-iron for a hybrid: much easier to hit. Used is fine, about $40-90.");
  else if (!has("HY") && !has("5W")) out.push("Add a hybrid (about 22°) for long shots. Used is fine, about $40-90.");
  if (!wedges.length) out.push("Add a sand wedge (56°). Used is fine, about $30-60.");
  else if (wedges.length === 1 && has("PW")) { const pw = b.find(c => c.id === "PW"), w = wedges[0]; if (pw.yards - w.yards > 20) out.push(`Gap between PW (${pw.yards}) and ${SHORT[w.id]} (${w.yards}). A 52/56 plan (or 50/54/58) fills it. Used is fine, about $30-60 each.`); }
  if (b.length > 14) out.push(`You have ${b.length} clubs; the rules allow 14. Leave out the one you hit worst.`);
  if (!has("DR")) out.push("No driver? Fine. A hybrid or 5-wood off the tee works.");
  if (!out.length) out.push("Your bag looks good. Nothing to buy.");
  out.push("A putter or wedges you love: worth buying new, you'll keep it 10 years.");
  return out;
}

/* ---------------- router + events ---------------- */
function route() { return (location.hash || "#home").slice(1); }
function go(r) { if (route() === r) render(); else location.hash = r; window.scrollTo(0, 0); }
function render() {
  let r = route();
  if (!D.setupDone && r === "home") { app.innerHTML = vSetup(); return; }
  const [base, arg] = r.split("/");
  const v = { aim: vAim, home: vHome, caddie: vCaddie, rules: vRules, routine: vRoutine, warm: vWarm, practice: vPractice, bag: vBag, gear: vGear, setup: vSetup }[base];
  try { app.innerHTML = base === "answer" ? vAnswer(arg) : base === "drill" ? vDrill(arg) : v ? v() : vHome(); }
  catch (e) { console.error(e); app.innerHTML = `<div class="msg">Something went wrong: ${esc(e.message)}</div><button data-a="go" data-r="home">Home</button>`; }
  ui.flash = "";
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

function setYd(raw) {
  ui.ydMsg = "";
  if (raw === "" || raw == null) { ui.yd = null; return; }
  let n = Math.round(Number(raw));
  if (!isFinite(n)) { ui.ydMsg = "Numbers only, please."; ui.yd = null; return; }
  if (n <= 0) { ui.ydMsg = `${n} yards? Is that right? Using 5.`; n = 5; }
  else if (n > 350) { ui.ydMsg = `${n} yards? Is that right? Using 350, the most we plan for.`; n = 350; }
  else if (n > 300) ui.ydMsg = `${n} yards. Is that right? That's a long one.`;
  ui.yd = n;
}
function applyPreset(k, onlyGuess) { D.clubs.forEach(c => { if (!onlyGuess || c.source === "guess") { c.yards = PRESET[k][c.id]; c.source = "guess"; } }); D.swing = k; }
function finishSetup() { D.setupDone = true; save(); ui.flash = "All set. Have fun out there!"; location.hash = "home"; render(); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]"); if (!t || t.tagName === "INPUT") return;
  const a = t.dataset.a, ds = t.dataset;
  switch (a) {
    case "go": go(ds.r); return;
    case "back": history.length > 1 ? history.back() : go("caddie"); return;
    case "skip": applyPreset("beginner"); finishSetup(); return;
    case "swing": applyPreset(ds.k); break;
    case "sstep": { const n = ui.setupStep + Number(ds.d); if (n > 2) { finishSetup(); return; } ui.setupStep = Math.max(0, n); break; }
    case "rerun": ui.setupStep = 0; D.setupDone = false; save(); go("home"); return;
    case "toggleclub": { const c = D.clubs.find(x => x.id === ds.id); c.inBag = !c.inBag; break; }
    case "togglecourse": { const i = D.courses.findIndex(x => x.id === ds.id); if (i >= 0) D.courses.splice(i, 1); else { const p = COURSES.find(x => x.id === ds.id); if (p) D.courses.push({ id: p.id, preset: true, tee: p.tee }); } break; }
    case "addcourse": { const nm = (ui.newCourse || "").trim(); if (nm) { D.courses.push({ id: "c" + Date.now(), preset: false, name: nm.slice(0, 60) }); ui.newCourse = ""; } break; }
    case "yd": { const cur = ui.yd == null ? (Number(ds.d) > 0 ? 95 : 105) : ui.yd; setYd(cur + Number(ds.d)); break; }
    case "ydset": setYd(ds.v); break;
    case "tile": { ui.missFb = null; const inp = document.getElementById("yd"); if (inp && String(inp.value) !== String(ui.yd == null ? "" : ui.yd)) setYd(inp.value); ui.ladder = null; go("answer/" + ds.t); return; }
    case "ladder": ui.ladder = ds.k; break;
    case "shot": recordShot(ds.c, ds.k); break;
    case "fixdone": D.miss.fix = ""; if (ui.missFb && ui.missFb.kind === "fix") ui.missFb = null; break;
    case "swap": D.miss.swaps[ds.id] = ds.t; if (ui.missFb) ui.missFb.club = ""; break;
    case "noswap": D.miss.declined[ds.id] = 1; if (ui.missFb) ui.missFb.club = ""; break;
    case "unswap": delete D.miss.swaps[ds.id]; D.miss.declined[ds.id] = 1; break;
    case "safety": D.miss.safety = false; D.miss.safetyOff = true; break;
    case "newround": newRound(); break;
    case "tc": {
      const id = document.getElementById("tcclub").value, v = Number(document.getElementById("tcyd").value);
      const c = D.clubs.find(x => x.id === id); ui.tcOpen = true;
      if (!c || !(v > 0) || v > 400) { ui.tcMsg = "Enter how many yards it went (a number above 0)."; break; }
      let ratio = Math.max(0.8, Math.min(1.15, v / c.yards));
      D.todayCheck = { date: today(), club: id, yards: v, ratio };
      const diff = v - c.yards;
      ui.tcMsg = diff <= -6 ? `Short today (${-diff} yd). Take one more club, swing easy. Picks are adjusted.` : diff >= 6 ? `Long today (+${diff} yd). Take one less club. Picks are adjusted.` : "Right on your numbers. Trust them.";
      if (Math.abs(diff) < 6) D.todayCheck.ratio = 1;
      break;
    }
    case "tcclear": D.todayCheck = null; ui.tcMsg = ""; ui.tcOpen = true; break;
    case "cardstart": { const cid = document.getElementById("cardc").value; newRound(); D.card = { date: today(), courseId: cid, hole: 1, holes: Array.from({ length: 18 }, (_, i) => ({ n: i + 1, strokes: 0, putts: 0, out: "" })) }; ui.cardOpen = true; break; }
    case "hole": D.card.hole = Math.max(1, Math.min(18, D.card.hole + Number(ds.d))); break;
    case "sc": { const h = D.card.holes[D.card.hole - 1]; h[ds.k] = Math.max(0, Math.min(15, (h[ds.k] || 0) + Number(ds.d))); break; }
    case "out": D.card.holes[D.card.hole - 1].out = ds.v; break;
    case "cardend": {
      const c = D.card, co = D.courses.find(x => x.id === c.courseId), played = c.holes.filter(h => h.strokes);
      if (played.length) D.rounds.unshift({ date: c.date, courseId: c.courseId, course: courseName(co), tee: co && co.tee || "", score: played.reduce((a, h) => a + h.strokes, 0), putts: played.reduce((a, h) => a + h.putts, 0), holes: played.map(h => ({ n: h.n, strokes: h.strokes, putts: h.putts, out: h.out })) });
      D.card = null; newRound(); ui.cardOpen = true; ui.flash = played.length ? "Round saved. Nice walk." : ""; break;
    }
    case "warm": ui.warm = Number(ds.m); break;
    case "balls": ui.balls = ds.b; break;
    case "rate": { const n = Number(ds.n); ui.rated[ds.id] = n; (D.drills[ds.id] = D.drills[ds.id] || []).push(n); D.drills[ds.id] = D.drills[ds.id].slice(-10); break; }
    case "qs": {
      const id = document.getElementById("qsclub").value, v = Number(document.getElementById("qsyd").value);
      if (!(v >= 20 && v <= 350)) { ui.bagMsg = "Enter yards between 20 and 350."; break; }
      const k = v / RATIO(id);
      D.clubs.forEach(c => { if (c.id === id) { c.yards = Math.round(v); c.source = "mine"; } else if (c.source === "guess" && c.kind !== "putter") c.yards = Math.round(k * RATIO(c.id)); });
      ui.bagMsg = "Filled in. Change any number you know."; break;
    }
    case "preset": applyPreset(ds.k, true); ui.bagMsg = "Guesses updated. Your own numbers were kept."; break;
    case "fitset": D.fit[ds.k] = ds.v; break;
    case "photodel": try { localStorage.removeItem(K_PHOTO); } catch (er) {} break;
    case "install": if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; } break;
    case "share": {
      if (navigator.share) navigator.share({ title: "Bogey Buddy", text: SHARE_TEXT, url: APP_URL }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(SHARE_TEXT).then(() => { ui.gearMsg = "Copied. Paste it in a text."; render(); }, () => { ui.gearMsg = "Select the text above and copy it."; render(); });
      return;
    }
    case "export": {
      const out = JSON.stringify({ app: "bogey-buddy", exported: new Date().toISOString(), data: D, photo: lsGet(K_PHOTO) || "" });
      try { const u = URL.createObjectURL(new Blob([out], { type: "application/json" })); const l = document.createElement("a"); l.href = u; l.download = "bogey-buddy-backup-" + today() + ".json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); ui.gearMsg = "Backup saved to your downloads."; }
      catch (er) { ui.gearMsg = "Couldn't save the file."; }
      break;
    }
    case "importtxt": doImport(document.getElementById("imptxt").value); return;
    case "reset": ui.confirmReset = true; break;
    case "resetno": ui.confirmReset = false; break;
    case "resetyes": lsSet(K_RESET, JSON.stringify(D)); D = blank(); ui.confirmReset = false; ui.setupStep = 0; save(); go("home"); return;
  }
  save(); render();
});
function doImport(text) {
  let p; try { p = JSON.parse(text); } catch (e) { ui.gearMsg = "That isn't a Bogey Buddy backup."; render(); return; }
  const d = p && p.data ? p.data : p;
  if (!d || !Array.isArray(d.clubs)) { ui.gearMsg = "That isn't a Bogey Buddy backup."; render(); return; }
  lsSet(K_RESET, JSON.stringify(D));
  D = normalize(d.v ? d : migrateOld(d, null)); D.setupDone = true;
  if (p.photo) { if (!lsSet(K_PHOTO, p.photo)) ui.gearMsg = "Restored, but the photo didn't fit in storage."; }
  if (save()) ui.gearMsg = ui.gearMsg || "Backup restored."; render();
}
document.addEventListener("input", e => { const f = e.target.dataset.f; if (f === "name") { D.name = e.target.value.slice(0, 40); save(); } else if (f === "newCourse") ui.newCourse = e.target.value; else if (f === "bagList") { D.bagList = e.target.value.slice(0, 2000); save(); } });
document.addEventListener("change", e => {
  const t = e.target, ds = t.dataset;
  if (t.id === "yd") { setYd(t.value); t.value = ui.yd == null ? "" : ui.yd; setTimeout(() => { const m = document.getElementById("ydmsg"); if (m) m.innerHTML = ui.ydMsg ? `<div class="msg" role="status">${esc(ui.ydMsg)}</div>` : ""; }, 350); return; }
  if (ds.club) { const c = D.clubs.find(x => x.id === ds.club); let v = Math.round(Number(t.value)); if (!(v > 0) || v > 400) { ui.bagMsg = `${c.name}: ${t.value || "blank"} yards? Is that right? Kept ${c.yards}.`; } else { if (v > 350) ui.bagMsg = `${c.name}: ${v} yards? Is that right?`; else ui.bagMsg = ""; c.yards = v; c.source = c.source === "guess" ? "mine" : c.source; } save(); render(); return; }
  if (ds.src) { D.clubs.find(x => x.id === ds.src).source = t.value; save(); return; }
  if (ds.fit) { D.fit[ds.fit] = t.value.slice(0, 12); save(); render(); return; }
  if (ds.tee) { const c = D.courses.find(x => x.id === ds.tee); if (c) c.tee = t.value; save(); return; }
  if (ds.a === "import" && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.readAsText(t.files[0]); return; }
  if (ds.a === "photo" && t.files && t.files[0]) savePhoto(t.files[0]);
});
document.addEventListener("toggle", e => { const d = e.target.dataset && e.target.dataset.d; if (d === "tc") ui.tcOpen = e.target.open; if (d === "card") ui.cardOpen = e.target.open; }, true);
/* Downscale the bag photo; never throw, never loop, never lose the main data (photo lives in its own key). */
function savePhoto(file) {
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    URL.revokeObjectURL(url);
    let ok = false;
    for (const [max, q] of [[900, 0.6], [640, 0.5], [420, 0.45]]) {
      try {
        const s = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement("canvas");
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        if (lsSet(K_PHOTO, cv.toDataURL("image/jpeg", q))) { ok = true; break; }
      } catch (e) { /* try smaller */ }
    }
    ui.bagMsg = ok ? "Photo saved." : "Phone storage is full, so the photo wasn't saved. Your clubs and numbers are safe.";
    render();
  };
  img.onerror = () => { URL.revokeObjectURL(url); ui.bagMsg = "Couldn't read that photo."; render(); };
  img.src = url;
}

function toast(html) { document.getElementById("toast").innerHTML = html ? `<div class="toast" role="status">${html}</div>` : ""; }
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(reg => { setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000); }).catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.type === "updated" && hadController) toast(`New version ready. <button data-a="reload" onclick="location.reload()">Refresh</button> <button onclick="toast('')" aria-label="Dismiss">✕</button>`); });
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) toast(`Bogey Buddy updated. <button onclick="location.reload()">Refresh</button> <button onclick="toast('')" aria-label="Dismiss">✕</button>`); });
}
window.BB = { missEval, normMiss };
