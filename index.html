<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Simple Caddie">
<meta name="theme-color" content="#1b4332">
<meta name="description" content="Simple Caddie: one club, one sentence. Private, offline golf helper.">
<title>Simple Caddie</title>
<!-- Simple Caddie v3 (2026-10-09). One offline file: no network requests, no
     accounts. Data stays in this browser's localStorage. YouTube links are
     plain tap-to-open links. Sources for scorecards, distance guesses and
     instruction are cited in comments next to the data below. -->
<style>
  :root {
    color-scheme: light;
    --bg: #efe6d4;
    --paper: #f7f1e4;
    --ink: #1c1915;
    --muted: #5e564c;
    --line: #d9cfbe;
    --green: #1b4332;
    --green-2: #2d6a4f;
    --rust: #8a3b2e;
    --amber: #8a5a12;
    --chip: #e7dcc8;
    --shadow: 0 1px 0 rgba(28, 25, 21, 0.04);
    --safe-t: env(safe-area-inset-top);
    --safe-b: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.35;
    min-height: 100dvh;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(14px + var(--safe-t)) 16px calc(28px + var(--safe-b));
  }
  h1 { font-size: 34px; line-height: 1; margin: 0 0 6px; letter-spacing: -0.03em; font-weight: 650; }
  h2 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.02em; font-weight: 650; }
  h3 { font-size: 17px; margin: 14px 0 8px; font-weight: 650; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 15px; color: var(--muted); }
  .kicker {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--green);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .job {
    display: block; width: 100%; text-align: left;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 18px; padding: 18px 16px; box-shadow: var(--shadow);
  }
  .job strong { display: block; font-size: 28px; letter-spacing: -0.03em; }
  .job span { display: block; color: var(--muted); margin-top: 4px; }
  .btn, .ghost, .danger {
    border-radius: 14px; min-height: 56px; padding: 12px 14px;
    border: 1px solid var(--line); background: var(--paper); text-align: center;
  }
  .btn { background: var(--green); color: #f7f1e4; border-color: var(--green); font-weight: 650; }
  .btn.secondary { background: var(--ink); border-color: var(--ink); }
  .ghost { background: var(--paper); }
  .danger { background: var(--rust); color: #f7f1e4; border-color: var(--rust); font-weight: 650; }
  .wide { width: 100%; }
  .chip {
    border: 1px solid var(--line); background: var(--chip);
    border-radius: 999px; min-height: 48px; padding: 10px 14px; flex: 1 1 auto;
  }
  .chip[aria-pressed="true"], .choice[aria-pressed="true"] {
    background: var(--green); color: #f7f1e4; border-color: var(--green);
  }
  .choice {
    flex: 1 1 calc(50% - 8px); min-height: 52px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--paper); padding: 10px;
  }
  label.field { display: block; font-size: 15px; color: var(--muted); margin: 12px 0 6px; }
  input[type="text"], input[type="number"], textarea, select {
    width: 100%; background: #fffdf8; border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; font-size: 18px; min-height: 52px;
  }
  textarea { min-height: 72px; resize: vertical; }
  .club-hero { font-size: 56px; line-height: 0.95; letter-spacing: -0.04em; margin: 4px 0 8px; font-weight: 700; }
  .tee-hero { font-size: 28px; margin: 0 0 12px; font-weight: 650; }
  .sentence { font-size: 22px; line-height: 1.35; margin: 0 0 16px; }
  table.card-table { width: 100%; border-collapse: collapse; }
  table.card-table th, table.card-table td { text-align: left; padding: 9px 0; border-bottom: 1px solid var(--line); }
  table.card-table td.num, table.card-table th.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 22px; }
  table.card-table tr:last-child td { border-bottom: 0; }
  .tag { font-size: 12px; color: var(--muted); font-weight: 500; }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 4px 8px; border-radius: 999px;
    background: var(--chip); color: var(--amber); border: 1px solid var(--line);
  }
  .badge.ok { color: var(--green); }
  .top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 14px;
  }
  .back {
    border: 0; background: transparent; color: var(--green);
    padding: 8px 0; min-height: 44px; font-weight: 650;
  }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hole {
    display: grid; grid-template-columns: 28px 72px 1fr; gap: 6px;
    align-items: center; margin-bottom: 6px;
  }
  .hole input, .hole select { min-height: 44px; padding: 8px; }
  .warn { color: var(--amber); }
  .hit { background: var(--green); color: #f7f1e4; border-color: var(--green); border-radius: 14px; min-height: 56px; border: 1px solid; }
  .miss { background: var(--rust); color: #f7f1e4; border-color: var(--rust); border-radius: 14px; min-height: 56px; border: 1px solid; }
  .progress { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 8px 0 14px; }
  .progress span { display: block; height: 100%; background: var(--green); }
  ul.plain { margin: 0; padding-left: 18px; }
  ul.plain li { margin: 6px 0; }
  .check {
    display: flex; gap: 10px; align-items: center; min-height: 48px;
    padding: 8px 0; border-bottom: 1px solid var(--line);
  }
  .check input { width: 22px; height: 22px; }
  details { margin-top: 18px; }
  summary { min-height: 44px; color: var(--muted); }
  .count { font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 700; }
  .svg-wrap { background: #fffdf8; border: 1px solid var(--line); border-radius: 14px; padding: 8px; margin: 10px 0; overflow: hidden; }
  .svg-wrap svg { width: 100%; height: auto; display: block; }
  .price { font-variant-numeric: tabular-nums; font-weight: 650; }
  .tip { border-left: 4px solid var(--green); padding: 10px 12px; margin: 8px 0; background: #fffdf8; border-radius: 0 12px 12px 0; }
  .situ {
    display: block; width: 100%; text-align: left; min-height: 52px;
    border-radius: 14px; border: 1px solid var(--line); background: var(--paper);
    padding: 12px 14px; margin-bottom: 8px;
  }
  .situ strong { display: block; }
  .situ span { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }

  .banner {
    background: var(--green); color: #f7f1e4; border-radius: 14px;
    padding: 12px 14px; margin-bottom: 12px; font-weight: 650; font-size: 15px;
  }
  .banner.guess { background: var(--amber); color: #fffdf8; }
  .chart { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
  .chart-row { display: grid; grid-template-columns: 72px 1fr 48px; gap: 8px; align-items: center; }
  .chart-bar-wrap { background: var(--chip); border-radius: 8px; height: 28px; overflow: hidden; }
  .chart-bar { height: 100%; background: var(--green); border-radius: 8px; min-width: 2px; }
  .chart-bar.guess-bar { background: #b0893a; }
  .verdict { border-left: 4px solid var(--green); padding: 10px 12px; background: #fffdf8; border-radius: 0 12px 12px 0; margin: 8px 0; }
  .verdict.change { border-left-color: var(--rust); }
  .thumb { width: 100%; max-height: 160px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); margin: 8px 0; background: #fffdf8; }
  .thumb-sm { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
  .wear-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }

  @media print {
    .no-print { display: none !important; }
    body { background: white; }
    #app { max-width: none; }
  }
  /* v2 additions */
  .door { min-height: 112px; }
  .door strong { font-size: 32px; }
  .door .em { float: right; font-size: 30px; line-height: 1; }
  .yardbox { display: grid; grid-template-columns: 72px 1fr 72px; gap: 8px; align-items: center; }
  .step { min-height: 64px; border-radius: 16px; border: 1px solid var(--line); background: var(--paper); font-size: 24px; font-weight: 700; }
  .yardbox input { text-align: center; font-size: 40px; font-weight: 700; min-height: 64px; letter-spacing: -0.02em; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips .chip { flex: 1 1 calc(25% - 6px); min-width: 64px; padding: 10px 6px; }
  .reply { background: #fffdf8; border: 2px solid var(--green); border-radius: 16px; padding: 14px 16px; font-size: 21px; line-height: 1.35; margin: 8px 0 12px; }
  .reply.missed { border-color: var(--rust); }
  .reply.warnline { border-color: var(--amber); }
  .overlay { position: fixed; inset: 0; background: rgba(28,25,21,0.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .overlay .card { max-width: 440px; width: 100%; }
  .one-thing { font-size: 26px; line-height: 1.3; font-weight: 650; margin: 6px 0 16px; }
  .src { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); }
  .src.guess { color: var(--amber); background: #f5ead2; }
  .src.mine { color: #1f3a5f; background: #e3eaf3; }
  .src.range { color: var(--green); background: #dfeee4; }
  .club-row { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .club-row:last-child { border-bottom: 0; }
  .club-row .yd { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
  .trust-row { display: grid; grid-template-columns: 90px 1fr 64px; gap: 8px; align-items: center; margin: 6px 0; }
  .how { border-left: 4px solid var(--green); }
  .how dl { margin: 8px 0 0; }
  .how dt { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--green); font-weight: 700; margin-top: 8px; }
  .how dd { margin: 2px 0 0; }
  .rule { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .rule:last-child { border-bottom: 0; }
  .rule strong { display: block; font-size: 19px; }
  .rule span { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
  .linkbtn { display: flex; align-items: center; justify-content: center; text-decoration: none; text-align: center; min-height: 56px; padding: 10px 14px; color: var(--green, #1b4332); font-weight: 600; box-sizing: border-box; }
  .sc-row { display: grid; grid-template-columns: 34px 44px 1fr 1fr 64px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .sc-row input { min-height: 46px; padding: 6px 8px; text-align: center; }
  .sc-row .pen { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; color: var(--muted); }
  .sc-head { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .holebar { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; align-items: center; }
  .holebar .mid { text-align: center; }
  .holebar .mid strong { display: block; font-size: 22px; }
  .tee-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tee-row .chip { flex: 1 1 calc(33% - 6px); }
  .wizard-dots { display: flex; gap: 6px; margin: 4px 0 12px; }
  .wizard-dots span { height: 6px; flex: 1; border-radius: 99px; background: var(--chip); }
  .wizard-dots span.on { background: var(--green); }
  .secondary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .secondary .ghost { min-height: 52px; font-size: 16px; }
  .note-list p { margin: 4px 0; }
  /* v3 additions: bigger tap targets, typeless inputs styled, new blocks */
  input:not([type]), input[inputmode] {
    width: 100%; background: #fffdf8; border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; font-size: 18px; min-height: 52px;
  }
  .yardbox input { min-height: 64px; }
  .split > * { min-width: 0; }
  .back { min-height: 48px; min-width: 64px; font-size: 18px; text-align: left; }
  summary { min-height: 48px; display: flex; align-items: center; cursor: pointer; }
  .ghost.sm { min-height: 48px; }
  .focusline { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; width: 100%; min-height: 56px;
    text-align: left; background: #fffdf8; border: 1px dashed var(--green-2); border-radius: 14px; padding: 10px 14px; }
  .focusline strong { font-size: 16px; }
  .pick { display: block; width: 100%; text-align: left; min-height: 64px; border-radius: 16px; border: 1px solid var(--line);
    background: var(--paper); padding: 12px 16px; }
  .pick strong { display: block; font-size: 20px; }
  .pick span { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
  .pick[aria-pressed="true"] { background: var(--green); color: #f7f1e4; border-color: var(--green); }
  .pick[aria-pressed="true"] span { color: #dfeee4; }
  .whatsnew { border: 2px solid var(--green); margin-bottom: 12px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .drill { margin-bottom: 10px; }
  .drill summary { display: block; padding-top: 4px; }
  .drill[open] summary { margin-bottom: 8px; }
  ol.steps { padding-left: 22px; margin: 8px 0 12px; }
  ol.steps li { margin: 8px 0; font-size: 17px; }
  .nudge { color: var(--green); font-weight: 600; }
  .home-tip { margin-top: 12px; }
  .chip.goal { border-radius: 14px; flex: 1 1 30%; line-height: 1.2; }
  .chip.goal span { font-size: 12px; opacity: 0.85; }
  .clubline { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .clubline:last-child { border-bottom: 0; }
  .clubline .chip { min-width: 64px; flex: none; }
  .clubline .ghost { min-height: 48px; padding: 8px 12px; }
  .filebtn { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; border: 1px solid var(--green);
    color: var(--green); font-weight: 650; background: #fffdf8; margin: 8px 0; cursor: pointer; }
  .filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .qrow { padding: 8px 0 10px; border-bottom: 1px solid var(--line); }
  .qrow:last-child { border-bottom: 0; }
  .fix { background: #fffdf8; border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: 0 12px 12px 0; padding: 10px 12px; margin: 8px 0; }
  .fixhead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .guide .ex { border-top: 1px solid var(--line); padding: 8px 0; }
  .guide a { color: var(--green); font-weight: 600; }
  .lastchecked { background: #f5ead2; border-radius: 10px; padding: 6px 10px; }
  .guide a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; }
</style>
</head>

function medianOf(list) {
  if (!list || !list.length) return null;
  const s = list.slice().sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2);
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { return empty(); }
  if (!raw) return empty();
  try {
    const parsed = JSON.parse(raw);
    // One-time copy of the pre-upgrade data, so nothing can be lost.
    if (!(parsed.v >= 2)) {
      try { if (!localStorage.getItem(PRE_UPGRADE_KEY)) localStorage.setItem(PRE_UPGRADE_KEY, raw); } catch (e) { /* storage full: skip copy */ }
    } else if (parsed.v === 2) {
      // v2 -> v3: keep an untouched copy of the v2 data, once.
      try { if (!localStorage.getItem(V2_BACKUP_KEY)) localStorage.setItem(V2_BACKUP_KEY, raw); } catch (e) { /* storage full: skip copy */ }
    }
    return migrate(parsed);
  } catch (e) {
    try { if (!localStorage.getItem(KEY + "-unreadable")) localStorage.setItem(KEY + "-unreadable", raw); } catch (e2) {}
    return empty();
  }
}

function migrate(parsed) {
  const base = empty();
  const oldClubs = parsed.clubs || [];
  base.clubs = DEFAULT_CLUBS.map(def => {
    const found = oldClubs.find(c => c.id === def.id);
    return found ? Object.assign({}, freshClub(def), found) : freshClub(def);
  });
  // keep custom clubs (older builds dropped them on reload)
  oldClubs.forEach(c => { if (!DEFAULT_CLUBS.find(d => d.id === c.id)) base.clubs.push(Object.assign(freshClub(c), c)); });
  base.clubs.forEach(c => {
    if (c.source === "hand") c.source = "mine";
    if (c.source === "estimate") { c.source = "guess"; c.est = true; }
    if (!c.source) c.source = "guess";
    if (!Array.isArray(c.rangeYardList)) c.rangeYardList = [];
    if (c.rangeYards == null && c.rangeYardList.length) c.rangeYards = medianOf(c.rangeYardList.slice(-10));
    if (!(parsed.v >= 2) && c.keeper == null) c.keeper = c.id === "DR";
  });

  const byId = {};
  (parsed.courses || []).forEach(c => { byId[c.id] = c; });
  base.courses = COURSE_PRESETS.map(p => {
    const u = byId[p.id];
    const pc = presetCourse(p);
    if (!u) return pc;
    const merged = Object.assign(pc, u, { greens: Object.assign({}, p.greens, u.greens || {}), preset: true });
    if (!merged.holeEdits) merged.holeEdits = {};
    if (!merged.tee || !(SCORECARDS[p.id] && SCORECARDS[p.id].tees[merged.tee])) merged.tee = DEFAULT_TEE[p.id] || "";
    // old builds stored typed hole yards in holes[]; keep them as edits
    (u.holes || []).forEach(h => {
      const y = String(h.yards == null ? "" : h.yards).trim();
      const n = String(h.notes || "").trim();
      if (y || n) merged.holeEdits[h.n] = Object.assign({}, merged.holeEdits[h.n] || {}, y ? { yards: y, par: h.par } : {}, n ? { notes: n } : {});
    });
    if ((u.holes || []).length) merged.legacyHoles = u.holes;
    merged.holes = [];
    return merged;
  });
  (parsed.courses || []).forEach(c => {
    if (!COURSE_PRESETS.find(p => p.id === c.id)) base.courses.push(Object.assign({ holes: [], holeEdits: {}, greens: { speed: "medium", firm: "medium", slope: "some", size: "medium" } }, c, { preset: false }));
  });

  base.activeCourseId = parsed.activeCourseId || "";
  base.shots = (parsed.shots || []).map(s => Object.assign({ ts: 0 }, s));
  base.rounds = (parsed.rounds || []).map(r => Object.assign({ ts: 0 }, r));
  base.rangeSessions = parsed.rangeSessions || [];
  base.notes = parsed.notes || [];
  base.live = parsed.live || null;
  base.driverUnbench = parsed.driverUnbench || null;
  base.phoneDay = parsed.phoneDay || null;
  base.lastRead = parsed.lastRead || null;
  base.bagAnswers = parsed.bagAnswers || {};
  base.bagPhoto = parsed.bagPhoto || "";
  base.putterLengthIn = parsed.putterLengthIn || "";
  base.golferHeightIn = parsed.golferHeightIn || "";
  base.todayCheck = Object.assign({}, base.todayCheck, parsed.todayCheck || {});
  base.seenIntro = !!parsed.seenIntro;
  // v3 fields (absent in v1/v2 data -> defaults)
  base.focus = Array.isArray(parsed.focus) ? parsed.focus.filter(f => FOCUS_AREAS.some(a => a.id === f)) : [];
  base.budget = Object.assign({}, base.budget, parsed.budget || {});
  const tu = parsed.tuneup || {};
  base.tuneup = Object.assign({}, base.tuneup, tu, { answers: Object.assign({}, tu.answers || {}), photos: Object.assign({}, tu.photos || {}) });
  base.whatsNewSeen = parsed.whatsNewSeen || "";
  base.homeDrillLog = Array.isArray(parsed.homeDrillLog) ? parsed.homeDrillLog : [];
  // Never drop anything we don't recognise (fields from other builds, freshStart, etc.).
  Object.keys(parsed).forEach(k => { if (!(k in base)) base[k] = parsed[k]; });
  base.v = 3;
  return base;
}

function proven(c) {

function teeFor(id, lie) {
  if (lie !== "tee") return "No tee";
  if (id === "DR") return "Tee";
  if (id === "5W" || id === "HY") return "Low tee";
  return "No tee";
}

function oneSentence(lead, input) {
  const extra = [];
  if (input.tilt === "away") extra.push("get closer to the ball");
  if (input.tilt === "toward") extra.push("stand taller and grip down");
  if (input.tilt === "left") extra.push("left side is low, so set your feet and do not chase it");
  if (input.tilt === "right") extra.push("right side is low, so set your feet and do not chase it");
  let s = String(lead).replace(/\.$/, "");
  if (extra.length) s += ", and " + extra.join(", and ");
  if (!/[.!?]$/.test(s)) s += ".";
  return s;
}

function forgivingPick(playable) {
  const prefs = ["8I", "7I", "HY", "9I", "PW", "52", "56", "5W", "6I"];
  const map = Object.fromEntries(playable.map(c => [c.id, c]));
  const hit = prefs.map(id => map[id]).filter(c => c && c.forgiving && proven(c));
  if (hit.length) {
    hit.sort((a, b) => trustOf(b).score - trustOf(a).score || (b.hits || 0) - (a.hits || 0));
    return hit[0];
  }
  return map["8I"] || map["HY"] || map["7I"] || playable[0];
}

function greenLine(course, lofted) {
  const g = (course && course.greens) || { speed: "medium", firm: "medium", slope: "some", size: "medium" };
  const firm = g.firm === "firm" || g.firm === "medium" && g.speed === "fast";
  const flatish = g.slope === "flat" || g.slope === "some";
  const softSloped = g.firm === "soft" || g.slope === "lots" || g.size === "small";
  if (lofted) {
    if (softSloped) return "Chip with a bit more height with the 56 here. Land it a step on the green and let it stop.";
    return "Loft it with the 56 — land soft and let it sit.";
  }
  if ((g.firm === "firm" || g.speed === "fast") && flatish) {
    return "Just do a little roll-up with the 52; these greens don't move much.";
  }
  if (g.slope === "lots") return "Bump-and-run with the 52, but start it on a quiet line — these greens break.";
  if (g.size === "small") return "Roll it with the 52 and leave yourself an uphill putt on this small green.";
  return "Bump-and-run with the 52. Land it short of the hole and let it roll.";
}

function shortGameRecommend(input, map, playable) {
  const need = Number(input.yards);
  const mustCarry = !!input.mustCarry;
  const course = activeCourse();
  const has52 = map["52"];
  const has56 = map["56"];
  const loftClub = has56 || map["SW"] || map["58"] || map["54"] || map["PW"] || playable[0];
  const rollClub = has52 || map["AW"] || map["PW"] || map["9I"] || loftClub;

  // Default: roll/bump inside 30 unless must carry
  const lofted = mustCarry || input.lie === "bunker" || input.situation === "bunker" || input.situation === "deeprough";
  const c = lofted ? loftClub : rollClub;
  const style = lofted ? "loft" : "bump";
  let lead;
  if (mustCarry) lead = greenLine(course, true).replace(/\.$/, "") + " — must carry the trouble";
  else if (input.lie === "bunker" || input.situation === "bunker") lead = (c.short || c.name) + " from the sand — open the face a touch, hit sand behind the ball, get it out";
  else lead = greenLine(course, lofted).replace(/\.$/, "");

  if (input.hill === "up") lead += "; uphill, easy swing";
  if (input.hill === "down") lead += "; downhill, less force";

  return {
    clubId: c.id,
    club: c.name,
    tee: "No tee",
    sentence: oneSentence(lead, input),
    note: (c.source === "guess" ? "guess until the range" : sourceLabel(c) + " · " + c.yards) + " · " + style,
    chip: style,
    diagram: style
  };
}

function situationRecommend(input, map, playable, order) {
  const sit = input.situation;
  if (!sit) return null;

  if (sit === "punch") {
    const c = map["7I"] || map["6I"] || map["8I"] || playable[0];
    return {
      clubId: c.id, club: c.name, tee: "No tee",
      sentence: oneSentence("Low punch with the " + (c.short || c.name) + " — ball back, hands ahead, back to the fairway, not at the pin", input),
      note: "punch-out"
    };
  }
  if (sit === "tree") {
    const c = map["8I"] || map["7I"] || map["HY"] || playable[0];
    return {
      clubId: c.id, club: c.name, tee: "No tee",
      sentence: oneSentence("Tree trouble — " + (c.short || c.name) + ", easy, sideways or back to short grass. Hero shots stay in the trees", input),
      note: "tree"
    };
  }
  if (sit === "deeprough") {
    const c = map["56"] || map["SW"] || map["HY"] || map["PW"] || playable[0];
    return {
      clubId: c.id, club: c.name, tee: "No tee",
      sentence: oneSentence("Deep rough — " + (c.short || c.name) + ", steep and easy, just advance it. Do not try to hit it far", input),
      note: "deep rough"
    };
  }
  if (sit === "bunker") {
    const c = map["56"] || map["SW"] || map["52"] || playable[0];
    return {
      clubId: c.id, club: c.name, tee: "No tee",
      sentence: oneSentence((c.short || c.name) + " — open face, hit the sand first, get it out", input),
      note: "bunker"
    };
  }
  if (sit === "above") {
    // ball above feet -> hooks; take less club feel / aim right; often shorter club
    let base = pickByYards(input, map, order);
    return {
      clubId: base.id, club: base.name, tee: teeFor(base.id, input.lie),
      sentence: oneSentence("Ball above your feet — choke down, aim a touch right, easier swing with the " + (base.short || base.name), input),
      note: "above feet"
    };
  }
  if (sit === "below") {
    let base = pickByYards(input, map, order);
    // often one more club
    const idx = order.indexOf(base.id);
    const more = order[clamp(idx + 1, 0, order.length - 1)];
    const c = map[more] || base;
    return {
      clubId: c.id, club: c.name, tee: teeFor(c.id, input.lie),
      sentence: oneSentence("Ball below your feet — bend more, stay down, one more club with the " + (c.short || c.name), input),
      note: "below feet"
    };
  }
  if (sit === "sidehill" || sit === "bincline") {
    let base = pickByYards(input, map, order);
    const more = input.hill === "up" || sit === "bincline";
    let idx = order.indexOf(base.id);
    if (more) idx = clamp(idx + 1, 0, order.length - 1);
    if (input.hill === "down") idx = clamp(idx - 1, 0, order.length - 1);
    const c = map[order[idx]] || base;
    return {
      clubId: c.id, club: c.name, tee: teeFor(c.id, input.lie),
      sentence: oneSentence("Hard hill — match shoulders to the slope, " + (c.short || c.name) + ", easy swing. Goal is contact, not distance", input),
      note: "hard hill"
    };
  }
  if (sit === "roll") {
    const fake = Object.assign({}, input, { yards: input.yards || "20", mustCarry: false });
    return shortGameRecommend(fake, map, playable);
  }
  if (sit === "loft") {
    const fake = Object.assign({}, input, { yards: input.yards || "20", mustCarry: true });
    return shortGameRecommend(fake, map, playable);
  }
  return null;
}

function pickByYards(input, map, order) {
  const unknown = input.mode === "unknown" || input.yards === "" || input.yards == null;
  if (unknown) return forgivingPick(order.map(id => map[id]).filter(Boolean));
  const need = Number(input.yards);
  let idx = order.length - 1;
  for (let i = 0; i < order.length; i++) {
    if (map[order[i]] && map[order[i]].yards + 5 >= need) { idx = i; break; }
  }
  return map[order[idx]] || forgivingPick(order.map(id => map[id]).filter(Boolean));
}


function lastRangeDate() {
  if (data.rangeSessions && data.rangeSessions[0]) return data.rangeSessions[0].date;
  return null;
}

function hasRangeBaseline() {
  return data.clubs.some(c => c.source === "range" || (c.rangeYardList && c.rangeYardList.length));
}

function rangeBannerHtml() {
  const d = lastRangeDate();
  if (hasRangeBaseline() && d) {
    return `<div class="banner">Using your range distances from ${esc(d)}</div>`;
  }
  return `<div class="banner guess">Using guesses — do a range session</div>`;
}

function clubAvgRange(c) {
  const list = (c.rangeYardList || []).slice();
  if (list.length) {
    return Math.round(list.reduce((a, b) => a + b, 0) / list.length);
  }
  return c.yards;
}

function clubSpread(c) {
  const list = (c.rangeYardList || []).slice();
  if (list.length < 2) return 0;
  return Math.max(...list) - Math.min(...list);
}

function missRate(c) {
  const h = c.hits || 0, m = c.misses || 0;
  const t = h + m;
  if (!t) return 0;
  return m / t;
}

function wearFlags(c) {
  const w = c.wear || {};
  const flags = [];
  if (w.grooves === "rounded" || w.grooves === "rusty") flags.push("grooves");
  if (w.face === "damage") flags.push("face");
  if (w.sole === "dings" || w.sole === "worn") flags.push("sole");
  if (w.grip === "slick" || w.grip === "cracked") flags.push("grip");
  if (w.shaft === "rust" || w.shaft === "dent") flags.push("shaft");
  return flags;
}

function priceForClub(c) {
  if (c.id === "DR") return PRICE_GUIDE.driver_g425;
  if (c.id === "5W") return PRICE_GUIDE.wood_g425_5;
  if (c.kind === "hybrid") return PRICE_GUIDE.hybrid;
  if (c.kind === "wedge") return PRICE_GUIDE.wedge;
  if (c.kind === "iron") return PRICE_GUIDE.irons_cavity;
  return PRICE_GUIDE.grips;
}

function costVerdict(c) {
  const price = priceForClub(c);
  const cost = price ? price.typical : 100;
  const flags = wearFlags(c);
  const spread = clubSpread(c);
  const miss = missRate(c);
  const needsChange = flags.includes("grip") || flags.includes("shaft") || flags.includes("face")
    || (miss >= 0.55 && (c.hits || 0) + (c.misses || 0) >= 6)
    || (spread >= 25 && (c.rangeYardList || []).length >= 4);

  if (c.keeper) {
    return {
      keep: true,
      title: "Keeper, not a problem area",
      why: "G425 driver is the gapping anchor. Consistency here beats a shiny new head.",
      cost: cost,
      skip: "Skip buying a new driver if you're finding the face."
    };
  }
  if (!needsChange) {
    return {
      keep: true,
      title: "Keep it — you're consistent, no need to spend $" + cost,
      why: flags.length ? ("Minor notes: " + flags.join(", ") + ".") : "Miss rate and distance spread look fine for a 2–3×/year player.",
      cost: cost,
      skip: "Skip if it's working."
    };
  }
  let fix = "Consider a used replacement (~$" + cost + ")";
  if (flags.includes("grip") && !flags.includes("face") && !flags.includes("shaft")) {
    fix = "Cheapest fix first: regrip (~$" + PRICE_GUIDE.grips.typical + "/club)";
  }
  return {
    keep: false,
    title: fix,
    why: "Data earned a look — " + [
      flags.length ? ("wear: " + flags.join(", ")) : "",
      miss >= 0.55 ? ("miss rate " + Math.round(miss * 100) + "%") : "",
      spread >= 25 ? ("range spread " + spread + " yd") : ""
    ].filter(Boolean).join("; ") + ".",
    cost: cost,
    skip: "Still skip if today's contact is solid — cheapest fix first."
  };
}

function searchLinksFor(c) {

  return [

function computeTodayCheck() {
  const tc = data.todayCheck || {};
  const iron = clubById(tc.ironId || "7I");
  const wood = clubById(tc.woodId || "HY");
  const ironToday = Number(tc.ironToday);
  const woodToday = Number(tc.woodToday);
  let ironOffset = 0, woodOffset = 0;
  const parts = [];

  if (iron && ironToday > 0) {
    const usual = iron.yards;
    ironOffset = ironToday - usual; // negative = shorter today
    if (Math.abs(ironOffset) <= 5) {
      parts.push("Right on your range numbers for the " + iron.short + ". Trust them.");
      ironOffset = 0;
    } else if (ironOffset < 0) {
      parts.push("You're hitting your " + iron.name + " " + ironToday + " today instead of your usual " + usual + ", so take one more club.");
    } else {
      parts.push("You're hitting your " + iron.name + " " + ironToday + " today instead of your usual " + usual + ", so you can take less club.");
    }
  }

  if (wood && woodToday > 0) {
    const usual = wood.yards;
    woodOffset = woodToday - usual;
    // Long-iron style message if checking a weak long iron vs rescue
    if (tc.woodId === "6I" || (wood.kind === "iron" && woodOffset < -15)) {
      const rescue = clubById("HY");
      const rDist = rescue ? rescue.yards : 170;
      const fly = Math.round(rDist * 0.9);
      parts.push("Your " + wood.name + " is going " + woodToday + " instead of " + usual + ". Try an easy rescue, which you normally hit " + rDist + ", to fly it about " + fly + ".");
      woodOffset = woodToday - usual;
    } else if (Math.abs(woodOffset) <= 5) {
      if (!parts.length) parts.push("Right on your range numbers. Trust them.");
      woodOffset = 0;
    } else if (woodOffset < 0) {
      parts.push("Your " + wood.name + " is going " + woodToday + " instead of your usual " + usual + ". Take more club (or the rescue) and swing easy.");
    } else {
      parts.push("Your " + wood.name + " is going " + woodToday + " instead of your usual " + usual + ". You can take less club.");
    }
  }

  if (!parts.length) parts.push("Right on your range numbers. Trust them.");

  // Convert yard offsets to club-shift hints: ~10–12 yd per club
  const ironShift = ironOffset <= -8 ? 1 : (ironOffset >= 8 ? -1 : 0);
  const woodShift = woodOffset <= -10 ? 1 : (woodOffset >= 10 ? -1 : 0);

  data.todayCheck = Object.assign({}, tc, {
    ironOffset: ironShift,
    woodOffset: woodShift,
    ironYardsDelta: ironOffset,
    woodYardsDelta: woodOffset,
    message: parts.join(" "),
    date: today()
  });
  save();
  return data.todayCheck;
}

function applyTodayOffsets(idx, order, map, chosenKind) {
  const tc = data.todayCheck || {};
  let shift = 0;
  if (chosenKind === "iron" || chosenKind === "wedge") shift += (tc.ironOffset || 0);
  if (chosenKind === "wood" || chosenKind === "hybrid" || chosenKind === "driver") shift += (tc.woodOffset || 0);
  // more club = higher index in ORDER (longer clubs are later)
  return clamp(idx + shift, 0, order.length - 1);
}


function ironWoodCheck(c, need, input) {
  if (!c || input.mode === "unknown") return "";
  const tc = data.todayCheck || {};
  if (tc.message && tc.date === today()) {
    // Prefer today's check one-liner when present
    return tc.message;
  }
  if (c.kind === "iron" && (c.id === "6I") && need >= 145) {
    const hy = clubById("HY");
    if (hy && hy.inBag) {
      return "Your 6-iron usual is " + c.yards + ". Try an easy rescue, which you normally hit " + hy.yards + ", to fly it about " + Math.round(hy.yards * 0.9) + ".";
    }
  }
  if (c.kind === "wood" || c.kind === "hybrid") return "Sweep it — brush the grass; do not dig.";
  if (c.kind === "iron") return "Ball first, then a shallow divot.";
  return "";
}

function baseRecommend(input) {
  const playable = data.clubs.filter(c => c.inBag && c.id !== "PU");
  const map = Object.fromEntries(playable.map(c => [c.id, c]));
  let order = ORDER.filter(id => map[id]);
  playable.forEach(c => {
    if (order.includes(c.id)) return;
    let inserted = false;
    for (let i = 0; i < order.length; i++) {
      if (map[order[i]].yards >= c.yards) { order.splice(i, 0, c.id); inserted = true; break; }
    }
    if (!inserted) order.push(c.id);
  });

  // Situations first
  const sit = situationRecommend(input, map, playable, order);
  if (sit) {
    const chk = ironWoodCheck(clubById(sit.clubId), Number(input.yards) || 0, input);
    if (chk && chk.trim()) {
      sit.sentence = sit.sentence.replace(/[.!?]$/, "") + ". " + chk.trim();
      if (!/[.!?]$/.test(sit.sentence)) sit.sentence += ".";
    }
    return sit;
  }

  if (input.lie === "bunker") {
    const c = map["56"] || map["SW"] || map["52"] || map["PW"] || playable[0];
    return {
      clubId: c.id, club: c.name, tee: "No tee",
      sentence: oneSentence(c.name + " and an easier swing — hit the sand and get it out, do not try to hit it far", input),
      note: sourceLabel(c)
    };
  }
  if (input.lie === "green") {
    return {
      clubId: "PU", club: "Putter", tee: "No tee",
      sentence: oneSentence("Putter — start it on line and accept the pace", input),
      note: "green"
    };
  }

  const unknown = input.mode === "unknown" || input.yards === "" || input.yards == null;
  const shaky = input.mode === "shaky";
  const need = Number(input.yards);

  // ≤30 yd short game (not tee)
  if (!unknown && !shaky && need > 0 && need <= 30 && input.lie !== "tee") {
    return shortGameRecommend(input, map, playable);
  }

  let shift = 0;
  if (input.hill === "up") shift += 1;
  if (input.hill === "down") shift -= 1;
  if (input.lie === "rough") shift += 1;

  // inside 40 legacy path (31-39) still wedge-focused
  if (!unknown && !shaky && need > 30 && need < 40 && input.lie !== "tee") {
    const shortOrder = ["56","52","SW","PW","9I"].filter(id => map[id]);
    let sidx = Math.max(0, shortOrder.indexOf("52"));
    if (shortOrder.indexOf("52") < 0) sidx = Math.max(0, shortOrder.indexOf("PW"));
    sidx = clamp(sidx + shift, 0, shortOrder.length - 1);
    const c = map[shortOrder[sidx]] || map["PW"] || playable[0];
    const lead = input.hill === "up" || input.lie === "rough"
      ? "Inside forty, uphill or rough, so a touch more club and an easier swing — on the green is enough"
      : input.hill === "down"
        ? "Inside forty and downhill, so less club — on the green is enough"
        : "Inside forty, so the wedge and an easier swing — on the green is enough";
    return { clubId: c.id, club: c.name, tee: "No tee", sentence: oneSentence(lead, input), note: sourceLabel(c) };
  }

  let idx, lead;
  if (unknown || shaky) {
    let base = forgivingPick(playable);
    if (input.lie === "tee" && map["HY"]) base = map["HY"];
    idx = Math.max(0, order.indexOf(base.id));
    const hy = order.indexOf("HY");
    const cap = hy >= 0 ? hy : order.length - 1;
    idx = clamp(idx + shift, 0, cap);
    {
      const tmp = map[order[idx]];
      if (tmp) idx = Math.min(cap, applyTodayOffsets(idx, order, map, tmp.kind));
    }
    const logged = playable.some(proven);
    lead = logged
      ? (shaky
        ? "The number is shaky, so a forgiving club you have actually hit, and an easier swing"
        : "Distance is unknown, so a forgiving club you have actually hit, and an easier swing")
      : "Nothing is logged yet, so a forgiving club and an easier swing until the range sets a number";
    if (input.hill === "up" && input.lie === "rough") lead = "Distance is shaky and it is uphill rough, so more club and an easier swing";
    else if (input.hill === "up") lead = "Distance is shaky and it is uphill, so more club and an easier swing";
    else if (input.lie === "rough" && input.hill === "down") lead = "Distance is shaky in downhill rough, so the same forgiving club and an easier swing";
    else if (input.lie === "rough") lead = "Distance is shaky and it is rough, so more club and an easier swing";
    else if (input.hill === "down") lead = "Distance is shaky and it is downhill, so less club and an easier swing";
  } else {
    idx = order.length - 1;
    for (let i = 0; i < order.length; i++) {
      if (map[order[i]].yards + 5 >= need) { idx = i; break; }
    }
    idx = clamp(idx + shift, 0, order.length - 1);
    {
      const tmp = map[order[idx]];
      if (tmp) idx = applyTodayOffsets(idx, order, map, tmp.kind);
    }
    if (order[idx] === "DR") {
      const onTee = input.lie === "tee";
      const hyYards = map["HY"] ? map["HY"].yards : 170;
      const driverNeeded = need >= hyYards - 5;
      if (!onTee || input.lie === "rough" || !driverNeeded) {
        const hy = order.indexOf("HY");
        const five = order.indexOf("5W");
        if (hy >= 0) idx = hy;
        else if (five >= 0) idx = five;
      }
    }
    if (input.hill === "up" && input.lie === "rough") lead = "Uphill and rough, so more club and an easier swing";
    else if (input.hill === "up") lead = "Uphill, so more club and an easier swing";
    else if (input.lie === "rough" && input.hill === "down") lead = "Downhill rough cancels, so the same club and an easier swing";
    else if (input.lie === "rough") lead = "Rough, so more club and an easier swing";
    else if (input.hill === "down") lead = "Downhill, so less club";
    else lead = "Swing easy — the job is to hit the ball, not to hit it far";
    const chosen = map[order[idx]];
    if (chosen && chosen.id === "DR" && chosen.yards + 8 < need) {
      lead = "No club covers that number — driver, easy, at the fat part of the fairway";
    } else if (chosen && chosen.id !== "DR" && need > chosen.yards + 12 && input.lie !== "tee") {
      lead = "More than you trust from here, so the hybrid and an easier swing — in play, not far";
      const hy = order.indexOf("HY");
      if (hy >= 0) idx = hy;
    }
  }

  const c = map[order[idx]] || playable[0];
  let sentence = oneSentence(lead, input);
  const chk = ironWoodCheck(c, need, input);
  if (chk && chk.trim()) {
    sentence = sentence.replace(/[.!?]$/, "") + ". " + chk.trim();
    if (!/[.!?]$/.test(sentence)) sentence += ".";
  }
  return {
    clubId: c.id,
    club: c.name,
    tee: teeFor(c.id, input.lie),
    sentence,
    note: c.source === "guess" ? "guess until the range" : sourceLabel(c) + " · " + c.yards
  };
}

function fillEstimates() {
  const pw = clubById("PW");
  const i8 = clubById("8I");
  if (!pw || !i8) return;
  if (pw.source !== "range" || i8.source !== "range") return;
  const gap = Math.round((i8.yards - pw.yards) / 2) || 12;
  [
    ["9I", pw.yards + gap],
    ["7I", i8.yards + gap],
    ["6I", i8.yards + gap * 2],
    ["52", Math.max(40, pw.yards - Math.round(gap * 0.6))],
    ["56", Math.max(35, pw.yards - gap)],
    ["AW", Math.max(45, pw.yards - Math.round(gap * 0.4))],
    ["5W", (clubById("HY") && clubById("HY").source === "range") ? clubById("HY").yards + gap : i8.yards + gap * 3]
  ].forEach(([id, yards]) => {
    const c = clubById(id);
    if (!c) return;
    if (c.source === "range" || c.source === "mine") return;
    c.yards = Math.round(yards / 5) * 5;
    c.source = "guess";
    c.est = true;
  });
}


/* ===================== v2 engine ===================== */

function pickOne(list, seed) {
  if (!list || !list.length) return "";
  const i = seed == null ? Math.floor(Math.random() * list.length) : Math.abs(seed) % list.length;
  return list[i];
}

/* Trust = how often this club actually got hit. Course taps count fully,
   range reps count half. Starts at 50% with no data. */
function trustOf(c) {
  if (!c) return { score: 0.5, n: 0, hits: 0, misses: 0, reps: 0, straight: 0 };
  const hits = c.hits || 0, misses = c.misses || 0;
  const straight = c.straights || 0;
  const reps = straight + (c.lefts || 0) + (c.rights || 0) + (c.thins || 0);
  const good = hits + 0.5 * straight;
  const total = hits + misses + 0.5 * reps;
  return { score: (good + 1) / (total + 2), n: hits + misses + reps, hits, misses, reps, straight };
}
function trustedRanking() {
  return data.clubs.filter(c => c.inBag && c.id !== "PU")
    .map(c => ({ c, t: trustOf(c) }))
    .filter(x => x.t.n > 0)
    .sort((a, b) => b.t.score - a.t.score || b.t.n - a.t.n);
}

function bagOrder() {
  const playable = data.clubs.filter(c => c.inBag && c.id !== "PU");
  const map = Object.fromEntries(playable.map(c => [c.id, c]));
  let order = ORDER.filter(id => map[id]);
  playable.forEach(c => {
    if (order.includes(c.id)) return;
    let inserted = false;
    for (let i = 0; i < order.length; i++) {
      if (map[order[i]].yards >= c.yards) { order.splice(i, 0, c.id); inserted = true; break; }
    }
    if (!inserted) order.push(c.id);
  });
  return { order, map };
}

/* ---- driver guard: 2 missed drives in a round -> hybrid off the tee ---- */
function roundStartTs() {
  if (data.live && data.live.date === today() && data.live.startedTs) return data.live.startedTs;
  const r = data.rounds.find(x => x.date === today() && x.ts);
  return r ? r.ts + 1 : 0;
}
function shotsThisRound() {
  const start = roundStartTs();
  return data.shots.filter(s => s.date === today() && (s.ts || 0) >= start);
}
function driverMissesThisRound() {
  return shotsThisRound().filter(s => s.clubId === "DR" && s.result === "missed").length;
}
function driverBenched() {
  const base = data.driverUnbench && data.driverUnbench.date === today() && data.driverUnbench.start === roundStartTs() ? data.driverUnbench.base : 0;
  return driverMissesThisRound() - base >= 2;
}

function howCardFor(r, input) {
  if (!r) return null;
  const need = Number(input && input.yards) || 0;
  const c = clubById(r.clubId);
  if (r.clubId === "PU") return "putt";
  if (input && (input.lie === "bunker" || input.situation === "bunker" || input.situation === "deeprough")) return null;
  if (r.chip || (need > 0 && need <= 30)) return "chip";
  if (!c) return null;
  if (c.kind === "driver") return "driver";
  if (c.kind === "wood") return "wood";
  if (c.kind === "wedge") {
    if (need > 0 && need <= 70) return "pitch";
    return "wedge";
  }
  if (need > 0 && need <= 70) return "pitch";
  if (need > 0 && need <= 100) return "wedge";
  return "iron";
}

function recommend(input) {
  const r = baseRecommend(input);
  const { order, map } = bagOrder();
  const need = Number(input.yards) || 0;
  const known = input.mode !== "unknown" && input.mode !== "shaky" && need > 0;
  const situational = !!input.situation || input.lie === "bunker" || input.lie === "green" || r.chip;

  // Trusted club steering: if a neighbor club covers the number about as well
  // and you hit it a lot more often, take it.
  if (known && !situational && need > 39 && map[r.clubId]) {
    const idx = order.indexOf(r.clubId);
    const cur = map[r.clubId];
    const ct = trustOf(cur);
    let best = null;
    [idx + 1, idx - 1].forEach(j => {
      const id = order[j];
      if (!id) return;
      const nb = map[id];
      if (id === "DR" && input.lie !== "tee") return;
      const fits = j > idx ? (nb.yards - need <= 15) : (nb.yards + 8 >= need);
      if (!fits) return;
      const nt = trustOf(nb);
      if (nt.n >= 3 && nt.score - ct.score >= 0.15 && (!best || nt.score > best.t.score)) best = { c: nb, t: nt };
    });
    if (best) {
      r.trustLine = "Picked your trusted " + best.c.name + " over the " + cur.name + " (" + Math.round(best.t.score * 100) + "% vs " + Math.round(ct.score * 100) + "% hit). " + (best.c.yards > cur.yards ? "Swing easy." : "Full, smooth swing.");
      r.clubId = best.c.id; r.club = best.c.name; r.tee = teeFor(best.c.id, input.lie);
      r.note = sourceLabel(best.c) + " · " + best.c.yards + " · trusted";
    }
  }

  // Driver guard
  if (input.lie === "tee" && r.clubId === "DR" && driverBenched()) {
    const alt = map["HY"] || map["5W"] || map["7I"] || map[order[order.length - 2]];
    if (alt) {
      r.clubId = alt.id; r.club = alt.name; r.tee = teeFor(alt.id, "tee");
      r.sentence = oneSentence("Two drives missed today, so the " + (alt.short || alt.name) + " off the tee — fairway beats far", input);
      r.note = "driver benched for this round";
      r.guard = true;
    }
  }
  r.how = howCardFor(r, input);
  return r;
}

/* One line after Hit / Missed. */
function replyFor(result, read) {
  const c = clubById(read && read.clubId);
  const kind = c ? c.kind : "";
  const need = Number(read && read.ask && read.ask.yards) || 0;
  const short = read && (read.chip || (need > 0 && need <= 30));
  const seed = data.shots.length;
  if (result === "hit") {
    if (kind === "driver") return { text: pickOne(REPLIES.hitDriver, seed), cls: "" };
    if (read && read.clubId === "PU") return { text: pickOne(REPLIES.hitPutt, seed), cls: "" };
    if (short) return { text: pickOne(REPLIES.hitShort, seed), cls: "" };
    return { text: pickOne(REPLIES.hit, seed), cls: "" };
  }
  if (kind === "driver") {
    const m = driverMissesThisRound();
    if (driverBenched() || m >= 2) return { text: REPLIES.missedDriver2[0], cls: "warnline" };
    return { text: REPLIES.missedDriver1[0], cls: "missed" };
  }
  if (read && read.clubId === "PU") return { text: REPLIES.missedPutt[0], cls: "missed" };
  if (short) return { text: pickOne(REPLIES.missedShort, seed), cls: "missed" };
  return { text: pickOne(REPLIES.missed, seed), cls: "missed" };
}

/* ---- Quick start: one club's carry -> guesses for the rest ---- */
function estimateFrom(clubId, carry, ids) {
  const base = GAP_RATIO[clubId];
  const out = {};
  if (!base || !(carry > 0)) return out;
  ids.forEach(id => {
    const r = GAP_RATIO[id];
    if (!r) return;
    out[id] = Math.max(10, Math.round((carry * r / base) / 5) * 5);
  });
  out[clubId] = Math.round(carry);
  return out;
}
function applyQuickStart(clubId, carry, never) {
  const ids = data.clubs.map(c => c.id);
  const est = never ? Object.assign({}, BEGINNER_CARRY) : estimateFrom(clubId, Number(carry), ids);
  let changed = 0;
  data.clubs.forEach(c => {
    if (c.id === "PU" || est[c.id] == null) return;
    if (c.source === "mine" || c.source === "range") return; // never overwrite real numbers
    c.yards = est[c.id];
    c.source = "guess";
    c.est = false;
    changed++;
  });
  if (!never && clubId) {
    const c = clubById(clubId);
    if (c && c.source !== "range") { c.yards = Math.round(Number(carry)); c.source = "mine"; }
  }
  save();
  return changed;
}

/* ---- Range numbers ---- */
function applyRangeClub(id, bucket) {
  if (!bucket.yards.length) return null;
  const med = medianOf(bucket.yards);
  const c = clubById(id);
  if (!c) return null;
  c.rangeYardList = (c.rangeYardList || []).concat(bucket.yards).slice(-20);
  c.rangeYards = med;
  c.rangeDate = today();
  if (c.source === "mine") {
    c.rangePending = c.yards !== med;     // "mine" wins until you tap "use range number"
  } else {
    c.yards = med;
    c.source = "range";
    c.rangePending = false;
  }
  save();
  return { club: c, med };
}
function useRangeNumber(id) {
  const c = clubById(id);
  if (!c || !c.rangeYards) return;
  c.yards = c.rangeYards; c.source = "range"; c.rangePending = false;
  save();
}
function setMine(id, yards) {
  const c = clubById(id);
  if (!c || !(yards > 0)) return;
  c.yards = Math.round(yards); c.source = "mine";
  c.rangePending = !!(c.rangeYards && c.rangeYards !== c.yards);
  save();
}

/* ---- Courses & tees ---- */
function teeNames(course) {
  const sc = course && SCORECARDS[course.id];
  return sc ? Object.keys(sc.tees) : [];
}
function courseHoles(course) {
  if (!course) return [];
  const sc = SCORECARDS[course.id];
  if (sc) {
    const teeName = sc.tees[course.tee] ? course.tee : (DEFAULT_TEE[course.id] || Object.keys(sc.tees)[0]);
    const tee = sc.tees[teeName];
    const par = tee.par || sc.par;
    return tee.y.map((y, i) => {
      const n = i + 1;
      const ed = (course.holeEdits || {})[n] || {};
      const edY = String(ed.yards == null ? "" : ed.yards).trim();
      return {
        n, par: edY && ed.par ? Number(ed.par) : par[i], hcp: sc.hcp[i],
        yards: edY ? edY : (y == null ? "" : String(y)),
        card: y == null ? "" : String(y), edited: !!edY, notes: ed.notes || ""
      };
    });
  }
  return (course.holes || []).map(h => ({ n: h.n, par: Number(h.par) || 4, yards: String(h.yards || ""), card: "", edited: !!h.yards, notes: h.notes || "" }));
}
function courseTotal(course) {
  return courseHoles(course).reduce((a, h) => a + (Number(h.yards) || 0), 0);
}
function shortCourseName(c) { return c ? c.name.split("—").pop().trim() : ""; }

/* ---- Live round (scorecard that survives a page reload) ---- */
function ensureLive() {
  if (!data.live || data.live.date !== today()) {
    data.live = { date: today(), startedTs: Date.now(), courseId: data.activeCourseId || "", hole: 1, holes: Array.from({ length: 18 }, (_, i) => ({ n: i + 1, strokes: "", putts: "", pen: false })) };
    save();
  }
  return data.live;
}
function liveTotals() {
  const l = data.live;
  if (!l) return { strokes: 0, putts: 0, pens: 0, holes: 0, toPar: 0 };
  const course = data.courses.find(c => c.id === l.courseId);
  const holes = courseHoles(course);
  let strokes = 0, putts = 0, pens = 0, n = 0, toPar = 0;
  l.holes.forEach(h => {
    const s = Number(h.strokes);
    if (s > 0) {
      strokes += s; n++;
      const hp = holes.find(x => x.n === h.n);
      if (hp && hp.par) toPar += s - hp.par;
    }
    if (Number(h.putts) > 0) putts += Number(h.putts);
    if (h.pen) pens++;
  });
  return { strokes, putts, pens, holes: n, toPar };
}

/* ---- Trends ---- */
function trendStats() {
  const scored = data.rounds.filter(r => Number(r.score) > 0);
  const full = scored.filter(r => !r.holesPlayed || r.holesPlayed >= 18);
  const avg = list => list.length ? Math.round(list.reduce((a, r) => a + Number(r.score), 0) / list.length) : null;
  const counts = {};
  data.rounds.slice(0, 10).forEach(r => (r.sideways || []).forEach(id => { counts[id] = (counts[id] || 0) + 1; }));
  const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || null;
  const puttRounds = data.rounds.filter(r => Number(r.putts) > 0);
  const missClubs = {};
  data.shots.slice(0, 60).forEach(s => { if (s.result === "missed") missClubs[s.club] = (missClubs[s.club] || 0) + 1; });
  const worstClub = Object.keys(missClubs).sort((a, b) => missClubs[b] - missClubs[a])[0] || null;
  return {
    rounds: data.rounds.length,
    avg: avg(full), avg5: avg(full.slice(0, 5)), best: full.length ? Math.min(...full.map(r => Number(r.score))) : null,
    top, topCount: top ? counts[top] : 0, counts,
    putts: puttRounds.length ? Math.round(puttRounds.reduce((a, r) => a + Number(r.putts), 0) / puttRounds.length) : null,
    worstClub, worstCount: worstClub ? missClubs[worstClub] : 0
  };
}
function sidewaysLabel(id) { const f = SIDEWAYS_V2.concat(SIDEWAYS).find(s => s[0] === id); return f ? f[1] : id; }

/* ---- Pro: practice plan from the last round ---- */
const PRACTICE_BLOCKS = {
  contact: { title: "Solid contact · 10 balls", how: "iron", text: "8-iron half swings. Brush the grass after the ball. Count how many you catch clean." },
  driver: { title: "Driver · 8 balls, then hybrid · 8", how: "driver", text: "Tee height half above the crown, 80% swing, hold the finish. Then the same with the hybrid off a low tee — that's your backup." },
  chipping: { title: "Chipping · 15 balls", how: "chip", text: "One chip: 52, ball back, hands ahead. Land it on one spot and let it roll." },
  putting: { title: "Putting · 10 minutes", how: "putt", text: "3-foot circle until you make 10 in a row. Then lag from 30 feet: stop within a putter length." },
  hills: { title: "Uneven lies · 10 balls", how: "iron", text: "Find a slope at the edge of the range. Match shoulders to the slope, half swings, contact first." },
  air: { title: "Getting it up · 10 balls", how: "iron", text: "9-iron, ball in the middle, weight forward. Hit down; let the loft lift it." },
  trouble: { title: "Punch-out · 6 balls", how: "iron", text: "7-iron, ball back, hands ahead, waist-high swing. Keep it under an imaginary branch." },
  contact2: { title: "Wedge distance · 10 balls", how: "pitch", text: "56 at 9 o'clock. Write the number you carry — that's your go-to layup." }
};
function proPlan() {
  const last = data.rounds[0];
  const ids = [];
  const focusNames = [];
  focusList().forEach(a => { if (a.block && PRACTICE_BLOCKS[a.block] && !ids.includes(a.block)) { ids.push(a.block); focusNames.push(a.label.toLowerCase()); } });
  (last && last.sideways || []).forEach(id => { if (PRACTICE_BLOCKS[id] && !ids.includes(id)) ids.push(id); });
  // misses tapped on the course
  const lastShots = last ? data.shots.filter(s => s.date === last.date) : data.shots.slice(0, 30);
  const drMiss = lastShots.filter(s => s.clubId === "DR" && s.result === "missed").length;
  if (drMiss >= 2 && !ids.includes("driver")) ids.push("driver");
  const shortMiss = lastShots.filter(s => s.result === "missed" && ["52","56","58","54","SW","AW"].includes(s.clubId)).length;
  if (shortMiss >= 2 && !ids.includes("chipping")) ids.push("chipping");
  if (ids.length === focusNames.length && !ids.includes("contact")) ids.push("contact", "contact2");
  if (!ids.includes("putting")) ids.push("putting"); // putting is always in the plan
  const blocks = ids.slice(0, 4);
  if (!blocks.includes("putting")) blocks[blocks.length - 1] = "putting"; // focus picks can't push putting out
  return { from: last ? last.date : "", focus: focusNames, blocks: blocks.map(id => Object.assign({ id }, PRACTICE_BLOCKS[id])) };
}

/* ---- Putter fit ---- */
function putterLengthAdvice() {
  const len = Number(data.putterLengthIn);
  const h = Number(data.golferHeightIn);
  if (!len && !h) return null;
  let lo, hi;
  if (h) {
    if (h < 68) { lo = 33; hi = 34; } else if (h < 72) { lo = 34; hi = 34.5; } else { lo = 35; hi = 35.5; }
  }
  if (len && h) {
    if (len > hi + 0.5) return { title: "Probably too long (" + len + "\" for " + h + "\" tall)", body: "The chart says about " + lo + "–" + hi + "\". If you also choke down or it pokes your belly, have a shop cut it (~$" + PRICE_GUIDE.putter_cut.low + "–$" + PRICE_GUIDE.putter_cut.high + "). Don't buy a new putter for length." };
    if (len < lo - 1) return { title: "Might be short — check posture first", body: "The chart says about " + lo + "–" + hi + "\". If you have to crouch, a longer putter may help, but stand taller first. Buying new is the last resort." };
    return { title: "Length looks fine — keep it", body: "About " + len + "\" vs the " + lo + "–" + hi + "\" chart. Keep it unless you choke down or it hits your belly. If the grip is slick, just regrip." };
  }
  if (h) return { title: "Chart says about " + lo + "–" + hi + "\"", body: "Measure your putter (floor to the end of the grip) and compare. Posture check beats the chart." };
  return { title: "Add your height for a chart check", body: "Then do the posture check: arms hang, grip meets your hands, eyes over the ball." };
}

/* ---- Help a friend ---- */
const FRIEND_CLUBS = [
  ["DR", "Driver"], ["5W", "Fairway wood"], ["HY", "Hybrid"], ["6I", "6-iron"], ["7I", "7-iron"], ["8I", "8-iron"], ["9I", "9-iron"], ["PW", "Pitching wedge"], ["56", "Sand wedge"]
];
function friendBag(f) {
  const ids = FRIEND_CLUBS.map(x => x[0]);
  const est = f.never || !(Number(f.carry) > 0) ? Object.assign({}, BEGINNER_CARRY) : estimateFrom(f.clubId || "7I", Number(f.carry), ids);
  return FRIEND_CLUBS.filter(([id]) => est[id]).map(([id, name]) => ({ id, name, yards: est[id] }));
}
function friendPick(f, yards, unknown) {
  const bag = friendBag(f).slice().sort((a, b) => a.yards - b.yards);
  const need = Number(yards);
  if (unknown || !(need > 0)) {
    const c = bag.find(b => b.id === "HY") || bag.find(b => b.id === "7I") || bag[0];
    return { club: c.name, line: "No number? The " + c.name.toLowerCase() + " and an easy swing. Hit it solid, not far." };
  }
  if (need <= 30) return { club: "9-iron or putter", line: "Inside 30: putt it if the grass is short, or a little bump with the 9-iron — like a long putt." };
  const nonDriver = bag.filter(b => b.id !== "DR");
  let c = nonDriver.find(b => b.yards + 5 >= need) || nonDriver[nonDriver.length - 1];
  const line = c.yards + 12 < need
    ? "That's farther than any club off the grass — the " + c.name.toLowerCase() + ", easy, and play the next one."
    : "The " + c.name.toLowerCase() + ". One more club than you think, easy swing.";
  return { club: c.name, line };
}
function friendCardText(f) {
  const bag = friendBag(f);
  const lines = [];
  lines.push("Simple Caddie card for " + (f.name || "you"));
  lines.push(f.never || !(Number(f.carry) > 0) ? "Starting numbers for a new golfer (guesses):" : "Your " + (FRIEND_CLUBS.find(x => x[0] === f.clubId) || ["", "club"])[1] + " goes " + f.carry + ", so roughly (guesses):");
  bag.forEach(b => lines.push("  " + b.name + ": " + b.yards));
  if (f.pick) lines.push("", "Shot pick: " + f.pick.club + " — " + f.pick.line);
  lines.push("", "Rules that help:");
  SIMPLIFY.slice(0, 5).forEach(r => lines.push("• " + r.t + " " + r.w));
  lines.push("", "Hit the ball. Not far — solid.");
  return lines.join("\n");
}

  return "Simplify the game\n\n" + SIMPLIFY.map(r => "• " + r.t + " " + r.w).join("\n");

function shareText(title, text) {
  if (navigator.share) {
    navigator.share({ title, text }).catch(() => {});

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => alert("Copied. Paste it into a text message.")).catch(() => showCopyBox(text));

}
